<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b0f19"><title>React Concept Check | Week 11-2</title>
<style>
:root{color-scheme:dark;--bg:#0b0f19;--panel:#121b2b;--panel2:#172033;--line:#2a3750;--text:#f8fafc;--muted:#a7b3c5;--blue:#38bdf8;--green:#7ee0bd;--red:#fda4af}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 18px;background:radial-gradient(ellipse at 10% 0%,#12334a,transparent 38%),var(--bg);color:var(--text);font:16px/1.6 Inter,system-ui,sans-serif}.wrap{max-width:760px;margin:auto}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}.back{display:inline-block;margin-bottom:18px}.eyebrow{color:var(--blue);font-weight:700;font-size:.76rem;letter-spacing:.14em}h1{font-size:clamp(2rem,7vw,3.4rem);line-height:1.1;margin:.3em 0}.sub{color:var(--muted)}.quiz{display:grid;gap:16px;margin-top:24px}.question{padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:14px}.question h2{font-size:1.08rem;margin:0 0 14px}.choices{display:grid;gap:8px}.choice{width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px 13px;color:var(--text);font:inherit;cursor:pointer}.choice:hover:not(:disabled){border-color:var(--blue)}.choice:disabled{cursor:default}.choice.correct{border-color:var(--green);background:#7ee0bd12}.choice.wrong{border-color:var(--red);background:#fda4af12}.feedback{min-height:24px;margin:10px 0 0;color:var(--muted);font-size:.92rem}.scorebox{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px;background:#38bdf812;border:1px solid #38bdf833;border-radius:12px}.scorebox strong{font-size:1.2rem}.reset{background:#0369a1;color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer}.reset:hover{background:#0284c7}footer{margin-top:24px;color:var(--muted);font-size:.88rem}
</style></head><body><main class="wrap"><a class="back" href="./">← Week 11-2 home</a><p class="eyebrow">LEARN / CHECK / REVIEW</p><h1>React concept check</h1><p class="sub">Choose an answer for each question. Read the explanation, then reset to try again.</p><section class="quiz" id="quiz" aria-label="React quiz"></section><div class="scorebox" aria-live="polite"><span>Practice score: <strong id="score">0 / 3</strong></span><button class="reset" id="reset" type="button">Try again</button></div><footer>Self-check activity · Score is stored only on this page.</footer></main>
<script>
const questions=[
 {q:'What is React mainly used for?',options:['Building user interfaces from reusable pieces','Writing database queries','Replacing HTML with a new browser'],answer:0,why:'React helps build user interfaces by composing reusable components.'},
 {q:'Which description best fits a React function component?',options:['A function that returns UI, often written with JSX','A CSS selector with a return value','A special HTML attribute'],answer:0,why:'A function component is a JavaScript function that describes the UI it should render.'},
 {q:'How does a component typically receive information from its parent?',options:['Through props','Through CSS classes','Through the browser address bar'],answer:0,why:'Props are inputs passed from a parent component to a child component.'}
];
const root=document.querySelector('#quiz');let score=0;
function render(){score=0;document.querySelector('#score').textContent='0 / 3';root.innerHTML='';questions.forEach((item,index)=>{const card=document.createElement('article');card.className='question';const heading=document.createElement('h2');heading.textContent=`${String(index+1).padStart(2,'0')} · ${item.q}`;const choices=document.createElement('div');choices.className='choices';const feedback=document.createElement('p');feedback.className='feedback';feedback.setAttribute('aria-live','polite');item.options.forEach((option,i)=>{const button=document.createElement('button');button.className='choice';button.type='button';button.textContent=option;button.addEventListener('click',()=>{choices.querySelectorAll('button').forEach((b,j)=>{b.disabled=true;if(j===item.answer)b.classList.add('correct')});if(i===item.answer){score++;feedback.textContent='Correct. '+item.why}else{button.classList.add('wrong');feedback.textContent='Not quite. '+item.why}document.querySelector('#score').textContent=`${score} / 3`});choices.append(button)});card.append(heading,choices,feedback);root.append(card)})}
document.querySelector('#reset').addEventListener('click',render);render();
</script></body></html>
