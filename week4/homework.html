<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Color Palette</title>
  <style>
    /* CSS STYLING & TRANSITIONS */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #1a1a2e;
      color: #fff;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #8a8a9e;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .controls {
      margin-bottom: 25px;
      display: flex;
      gap: 10px;
    }

    input {
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: 2px solid #30304d;
      background-color: #161623;
      color: white;
      outline: none;
      width: 150px;
      text-transform: uppercase;
    }

    input:focus {
      border-color: #00bcd4;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      border: none;
      background-color: #00bcd4;
      color: #1a1a2e;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background-color: #0097a7;
    }

    /* Required: Flexbox layout for container */
    .palette-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      padding: 30px;
      background: #161623;
      border-radius: 12px;
      max-width: 800px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    /* Required: Base styles for boxes */
    .color-box {
      width: 100px;
      height: 100px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #000;
      text-shadow: 0 0 4px rgba(255,255,255,0.6);
      cursor: pointer;
      user-select: none;
      /* Required: Smooth layout transition rule */
      transition: width 0.3s ease, height 0.3s ease, transform 0.2s ease;
    }

    .color-box:hover {
      transform: scale(1.03);
    }

    /* Required: CSS transition state triggered by classList toggle */
    .color-box.expanded {
      width: 160px;
      height: 160px;
      font-size: 18px;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
    }

    .btn-export {
      margin-top: 30px;
      background-color: #28a745;
      color: white;
    }

    .btn-export:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

  <h1>Interactive Color Palette</h1>
  <div class="subtitle">Click to expand | Double-click to remove</div>
  
  <!-- Challenge Tier Input UI Controls -->
  <div class="controls">
    <input type="text" id="colorInput" placeholder="#FF5733" maxlength="7">
    <button id="addColorBtn">Add Color</button>
  </div>

  <!-- Required Tier Main Flexbox Grid -->
  <div id="palette" class="palette-container"></div>

  <!-- Extra Credit Bonus PNG Export Trigger -->
  <button id="exportBtn" class="btn-export">Export Palette as PNG</button>

  <!-- External dependency script required specifically for the PNG export function -->
  <script src="https://cloudflare.com"></script>

  <script>
    // JAVASCRIPT APPLICATION LOGIC

    // Required: Initial system defaults containing 6 color blocks
    const defaultColors = ['#FF5733', '#33FF57', '#3357FF', '#F3FF33', '#FF33F3', '#33FFF0'];

    // Local References
    const palette = document.getElementById('palette');
    const colorInput = document.getElementById('colorInput');
    const addColorBtn = document.getElementById('addColorBtn');
    const exportBtn = document.getElementById('exportBtn');

    // Extra Credit: RESTORE boxes on page reload from localStorage or use defaults
    let colors = JSON.parse(localStorage.getItem('savedColors')) || defaultColors;

    // Extra Credit: SAVE the color list data array to localStorage memory engine
    function saveToStorage() {
      localStorage.setItem('savedColors', JSON.stringify(colors));
    }

    // Dynamic Color Box Factory
    function createColorBox(hex) {
      const box = document.createElement('div');
      box.classList.add('color-box');
      box.style.backgroundColor = hex;
      
      // Determine contrast text color safely depending on brightness (White vs Dark text layout)
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      const brightness = (r * 299 + g * 587 + b * 114) / 1000;
      box.style.color = brightness > 125 ? '#000000' : '#FFFFFF';

      // Required: Click Box -> Expands (.classList.toggle + CSS transitions)
      // Required: Show hex color string code only when expanded (.textContent)
      box.addEventListener('click', () => {
        box.classList.toggle('expanded');
        box.textContent = box.classList.contains('expanded') ? hex.toUpperCase() : '';
      });

      // Challenge: Double-click any box to remove it element structure (dblclick event)
      box.addEventListener('dblclick', () => {
        box.remove();
        colors = colors.filter(c => c !== hex); // Erase targeted value item from working state
        saveToStorage(); // Synch back up into device storage
      });

      return box;
    }

    // App Initialization Engine
    function renderPalette() {
      palette.innerHTML = '';
      colors.forEach(hex => {
        palette.appendChild(createColorBox(hex));
      });
    }

    // Challenge: Hex values processing and safety parsing validations
    addColorBtn.addEventListener('click', () => {
      let hex = colorInput.value.trim();
      
      // Handle missing hash signs seamlessly
      if (!hex.startsWith('#')) {
        hex = '#' + hex;
      }

      // Regex filter verifying standard HEX syntax structures
      const isValidHex = /^#[0-9A-F]{6}$/i.test(hex);
      
      if (isValidHex) {
        colors.push(hex);
        saveToStorage();
        palette.appendChild(createColorBox(hex));
        colorInput.value = ''; // Clean box field values layout input
      } else {
        alert('Please enter a valid 6-character Hex Code (e.g., #FF5733)');
      }
    });

    // Support keyboard validation entry updates via Enter key click structures
    colorInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addColorBtn.click();
    });

    // Extra Credit Bonus: Export visual layout component container targets into PNG files directly
    exportBtn.addEventListener('click', () => {
      html2canvas(palette).then(canvas => {
        const downloadTrackerLink = document.createElement('a');
        downloadTrackerLink.download = 'color-palette-export.png';
        downloadTrackerLink.href = canvas.toDataURL('image/png');
        downloadTrackerLink.click();
      });
    });

    // Initialize display output routine
    renderPalette();
  </script>
</body>
</html>
