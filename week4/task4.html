<!DOCTYPE html>
<html><body style="font-family:system-ui;padding:20px;max-width:420px;margin:auto">
  <style>
    h2 { color: #1a56db; }
    #search { width:100%; padding:10px 14px; font-size:16px;
      border:2px solid #1a56db; border-radius:10px; margin-bottom:14px; }
    .student { padding:10px 14px; margin-bottom:6px; background:#f0f4ff;
      border-radius:8px; border:1px solid #c8d4f0; font-size:15px; }
    mark { background: #f7df1e; border-radius: 3px; }
    #no-results { display:none; color:#9ca3af; text-align:center; padding:20px; }
  </style>

  <h2>Student Search</h2>
  <input id="search" type="text" placeholder="Search students...">
  <div id="student-list">
    <div class="student" data-name="OTGONJARGAL MURUN">OTGONJARGAL MURUN — Web Programming</div>
    <div class="student" data-name="Anand">Anand — Economics</div>
    <div class="student" data-name="Sambuu">Sambuu — Business</div>
    <div class="student" data-name="Degii">Degii — AI</div>
    <div class="student" data-name="Chinguun">Chinguun — Philosophy</div>
    <div class="student" data-name="Lhamaa">Lhamaa — Mathematics</div>
  </div>
  <p id="no-results">No students found.</p>

  <script>
// 1. Select #search, all .student elements, and #no-results
const searchInput = document.querySelector('#search');
const students = document.querySelectorAll('.student');
const noResults = document.querySelector('#no-results');

// Save original text content on each element to handle highlighting cleanly
students.forEach(student => {
  student.dataset.originalText = student.textContent;
});

// 2. Add 'input' event listener to search box
searchInput.addEventListener('input', (e) => {
  const term = e.target.value.toLowerCase();
  let visibleCount = 0;

  // 3. Filter through students
  students.forEach(student => {
    const text = student.dataset.originalText;
    const lowerText = text.toLowerCase();

    if (term === '') {
      student.style.display = '';
      student.textContent = text;
      visibleCount++;
    } else if (lowerText.includes(term)) {
      student.style.display = '';
      visibleCount++;

      // BONUS: Highlight matched text using <mark>
      const regex = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      student.innerHTML = text.replace(regex, '<mark>$1</mark>');
    } else {
      student.style.display = 'none';
    }
  });

  // 4. Show #no-results if no students match
  noResults.style.display = visibleCount === 0 ? 'block' : 'none';
});
  </script>
</body></html>
