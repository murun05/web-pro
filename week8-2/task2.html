<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>preventDefault() on Submit</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 30px 16px; max-width: 460px; margin: 0 auto; color: #1e293b; }
    label { display: block; font-weight: 600; font-size: .9rem; margin: 14px 0 4px; }
    input { width: 100%; padding: 9px 12px; font-size: 1rem; border: 2px solid #c8d4f0; border-radius: 8px; box-sizing: border-box; }
    button { margin-top: 14px; padding: 10px 20px; font-weight: 700; color: white; background: #1a56db; border: none; border-radius: 8px; cursor: pointer; }
    #log { margin-top: 18px; padding: 12px; border-radius: 8px; background: #f1f5f9; font-family: Consolas, monospace; font-size: .85rem; }
  </style>
</head>
<body>
  <h1>preventDefault()</h1>
  <p>Submit the form — the page does not reload, and the log keeps every attempt.</p>

  <form id="form" novalidate>
    <label for="username">Username</label>
    <input type="text" id="username" required minlength="3">
    <button type="submit">Submit</button>
  </form>

  <div id="log">Waiting for submit…</div>

  <script>
    const form = document.querySelector('#form');
    const username = document.querySelector('#username');
    const log = document.querySelector('#log');
    let attempts = 0;

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      attempts++;
      if (!form.checkValidity()) {
        log.textContent = 'Attempt ' + attempts + ': blocked — username needs at least 3 characters.';
        return;
      }

      log.textContent = 'Attempt ' + attempts + ': OK — would send { username: "' + username.value + '" }';
    });
  </script>
</body>
</html>
