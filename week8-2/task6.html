<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aria-describedby & aria-invalid</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 30px 16px; max-width: 460px; margin: 0 auto; color: #1e293b; }
    label { display: block; font-weight: 600; font-size: .9rem; margin: 14px 0 4px; }
    input { width: 100%; padding: 9px 12px; font-size: 1rem; border: 2px solid #c8d4f0; border-radius: 8px; box-sizing: border-box; }
   
    input[aria-invalid="true"] { border-color: #dc2626; background: #fef2f2; }
    .error { min-height: 1.2em; margin: 6px 0 0; color: #dc2626; font-size: .85rem; }
    button { margin-top: 14px; padding: 10px 20px; font-weight: 700; color: white; background: #1a56db; border: none; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
 
  <h1>aria-describedby &amp; aria-invalid</h1>
  <p>Submit with a short code, then focus the field with a screen reader on.</p>

  <form id="form" novalidate>
    <label for="code">Course code</label>
    <input type="text" id="code" required pattern="[A-Z]\d{7}" placeholder="K0126002"
           aria-describedby="code-error">
    <span class="error" id="code-error" aria-live="polite"></span>
    <br>
    <button type="submit">Submit</button>
  </form>

  <script>
    const form = document.querySelector('#form');
    const code = document.querySelector('#code');
    const codeError = document.querySelector('#code-error');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const ok = code.checkValidity();
      code.setAttribute('aria-invalid', String(!ok));
      codeError.textContent = ok ? '' : 'Use one capital letter and 7 digits, like K0126002.';
      if (!ok) code.focus();
    });
  </script>
</body>
</html>
