<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>novalidate</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 30px 16px; max-width: 460px; margin: 0 auto; color: #1e293b; }
    h2 { margin-top: 28px; font-size: 1.05rem; }
    label { display: block; font-weight: 600; font-size: .9rem; margin: 14px 0 4px; }
    input { width: 100%; padding: 9px 12px; font-size: 1rem; border: 2px solid #c8d4f0; border-radius: 8px; box-sizing: border-box; }
    button { margin-top: 14px; padding: 10px 20px; font-weight: 700; color: white; background: #1a56db; border: none; border-radius: 8px; cursor: pointer; }
    .error { min-height: 1.2em; margin: 6px 0 0; color: #dc2626; font-size: .85rem; }
  </style>
</head>
<body>
  <h1>novalidate</h1>
  <p>Submit both forms with an empty email.</p>

  <h2>Without novalidate — browser bubble</h2>
  <form>
    <label for="a">Email</label>
    <input type="email" id="a" required>
    <button type="submit">Submit</button>
  </form>

  <h2>With novalidate — JavaScript shows the error</h2>
  <form id="js-form" novalidate>
    <label for="b">Email</label>
    <input type="email" id="b" required>
    <p class="error" id="b-error"></p>
    <button type="submit">Submit</button>
  </form>

  <script>
    const form = document.querySelector('#js-form');
    const email = document.querySelector('#b');
    const error = document.querySelector('#b-error');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      error.textContent = email.checkValidity() ? '' : 'Please enter a valid email address.';
    });
  </script>
</body>
</html>
