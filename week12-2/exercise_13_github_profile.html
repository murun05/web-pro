<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Debounced GitHub Profile · Week 12-2</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap page"><a class="back" href="./">← Week 12-2 home</a><p class="eyebrow">EXERCISE 13 / PRACTICE CHALLENGE</p><h1>Debounced profile search</h1><p class="lead">A 500 ms debounce avoids sending a request for every keystroke. Stale fetches are aborted.</p><section class="demo"><label for="username">GitHub username</label><input id="username" value="octocat" autocomplete="off"><div id="result" aria-live="polite"></div></section><footer>Otgonjargal Murun · Week 12-2</footer></main><script>let timer,controller;const input=document.querySelector('#username'),out=document.querySelector('#result');async function lookup(){controller?.abort();controller=new AbortController();const name=input.value.trim();if(!name){out.textContent='Type a username to search.';return}out.textContent='Searching…';try{const r=await fetch('https://api.github.com/users/'+encodeURIComponent(name),{signal:controller.signal});if(r.status===404)throw Error('User not found.');if(!r.ok)throw Error('GitHub request failed ('+r.status+').');const u=await r.json();out.innerHTML=`<div class="profile"><img src="${u.avatar_url}" alt=""><div><h2>${u.name||u.login}</h2><p>@${u.login} · ${u.public_repos} repositories</p><p>${u.bio||'No bio available.'}</p></div></div>`}catch(e){if(e.name!=='AbortError')out.innerHTML=`<p class="error">${e.message}</p>`}}input.oninput=()=>{clearTimeout(timer);controller?.abort();out.textContent='Waiting for you to finish typing…';timer=setTimeout(lookup,500)};lookup()</script></body></html>
