<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timer Cleanup · Week 12-2</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap page"><a class="back" href="./">← Week 12-2 home</a><p class="eyebrow">EXERCISE 05 / CLEANUP</p><h1>Live clock timer</h1><p class="lead">Mounting starts one interval. Unmounting clears it so ticks stop.</p><section class="demo"><button id="toggle">Unmount clock</button><p id="clock" class="temp"></p><div id="log" class="log"></div></section><footer>Otgonjargal Murun · Week 12-2</footer></main><script>let timer=null;const clock=document.querySelector('#clock'),log=document.querySelector('#log'),button=document.querySelector('#toggle');function tick(){clock.textContent=new Date().toLocaleTimeString()}function mount(){tick();timer=setInterval(tick,1000);button.textContent='Unmount clock';log.textContent='Interval started.'}function unmount(){clearInterval(timer);timer=null;button.textContent='Mount clock';clock.textContent='Clock stopped';log.textContent='Cleanup cleared interval.'}button.onclick=()=>timer?unmount():mount();mount();</script></body></html>
