<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fetch on Mount · Week 12-2</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap page"><a class="back" href="./">← Week 12-2 home</a><p class="eyebrow">EXERCISE 03 / DATA FETCHING</p><h1>Fetch on mount</h1><p class="lead">Choose a user id. The profile request follows the selected id and displays loading and error states.</p><section class="demo"><div class="row" id="choices"></div><div id="result" class="status" aria-live="polite"></div></section><footer>Otgonjargal Murun · Week 12-2</footer></main><script>let controller;const out=document.querySelector('#result');function load(id){controller?.abort();controller=new AbortController();out.textContent='Loading user '+id+'…';fetch('https://jsonplaceholder.typicode.com/users/'+id,{signal:controller.signal}).then(r=>{if(!r.ok)throw Error('User not found');return r.json()}).then(u=>out.innerHTML=`<article class="box"><h2>${u.name}</h2><p>${u.email}</p><p>${u.address.city}</p></article>`).catch(e=>{if(e.name!=='AbortError')out.innerHTML='<p class="error">'+e.message+'</p>'})}document.querySelector('#choices').innerHTML=[1,2,3,99].map(n=>`<button data-id="${n}">User ${n}</button>`).join('');document.querySelector('#choices').onclick=e=>{if(e.target.dataset.id)load(e.target.dataset.id)};load(1);</script></body></html>
