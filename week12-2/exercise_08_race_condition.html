<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Race Conditions · Week 12-2</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap page"><a class="back" href="./">← Week 12-2 home</a><p class="eyebrow">EXERCISE 08 / RACE CONDITIONS</p><h1>Out-of-order responses</h1><p class="lead">Simulated shorter queries take longer. Turn on cancellation, then type quickly to compare.</p><section class="demo"><label><input id="safe" type="checkbox"> Cancel previous request</label><p><input id="query" placeholder="Try typing abcdef quickly"></p><p>Current query: <b id="current">—</b></p><p>Last result: <b id="result">—</b></p><div id="log" class="log"></div></section><footer>Otgonjargal Murun · Week 12-2</footer></main><script>let safe=false,token=0;const query=document.querySelector('#query'),result=document.querySelector('#result'),log=document.querySelector('#log');document.querySelector('#safe').onchange=e=>{safe=e.target.checked;token++};function note(s){const d=document.createElement('div');d.textContent=s;log.prepend(d)}query.oninput=()=>{const q=query.value;document.querySelector('#current').textContent=q||'—';if(!q)return;const mine=++token,delay=Math.max(250,1600-q.length*220);note(`Request “${q}” (${delay} ms)`);setTimeout(()=>{if(safe&&mine!==token){note(`Discarded stale response for “${q}”`);return}result.textContent=q;note(`Response arrived: “${q}”`)},delay)};</script></body></html>
