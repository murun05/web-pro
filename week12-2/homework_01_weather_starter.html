<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather Starter · Week 12-2</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap page"><a class="back" href="./">← Week 12-2 home</a><p class="eyebrow">HOMEWORK 01 / STARTER</p><h1>Weather by coordinates</h1><p class="lead">Edit latitude or longitude to request current conditions from Open-Meteo.</p><section class="demo"><div class="row"><label>Latitude <input id="lat" type="number" step=".01" value="37.57"></label><label>Longitude <input id="lon" type="number" step=".01" value="126.98"></label></div><div id="result" aria-live="polite"></div></section><p class="muted">Next: <a href="homework_02_city_search.html">search by city →</a></p><footer>Otgonjargal Murun · Week 12-2</footer></main><script>let controller;const out=document.querySelector('#result');async function load(){controller?.abort();controller=new AbortController();out.textContent='Loading weather…';try{const lat=Number(document.querySelector('#lat').value),lon=Number(document.querySelector('#lon').value);if(lat < -90||lat>90||lon < -180||lon>180)throw Error('Latitude must be −90 to 90 and longitude −180 to 180.');const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,wind_speed_10m,weather_code`;const r=await fetch(url,{signal:controller.signal});if(!r.ok)throw Error('Weather service request failed.');const d=await r.json();out.innerHTML=`<div class="weather"><div><p class="temp">${d.current.temperature_2m}${d.current_units.temperature_2m}</p><p>Wind ${d.current.wind_speed_10m} ${d.current_units.wind_speed_10m} · weather code ${d.current.weather_code}</p></div></div>`}catch(e){if(e.name!=='AbortError')out.innerHTML=`<p class="error">${e.message}</p>`}}for(const id of ['lat','lon'])document.querySelector('#'+id).onchange=load;load()</script></body></html>
