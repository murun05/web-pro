<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitHub Lookup · Week 12-2</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap page"><a class="back" href="./">← Week 12-2 home</a><p class="eyebrow">EXERCISE 07 / CODE CHALLENGE</p><h1>GitHub user lookup</h1><p class="lead">Submit a username to view its profile, repository count, and bio.</p><section class="demo"><form id="form" class="row"><input id="username" placeholder="octocat" required><button>Search profile</button></form><div id="result" aria-live="polite"></div></section><footer>Otgonjargal Murun · Week 12-2</footer></main><script>let active;const out=document.querySelector('#result');document.querySelector('#form').onsubmit=async e=>{e.preventDefault();active?.abort();active=new AbortController();const name=document.querySelector('#username').value.trim();out.textContent='Loading profile…';try{const r=await fetch('https://api.github.com/users/'+encodeURIComponent(name),{signal:active.signal});if(r.status===404)throw Error('No GitHub user named “'+name+'”.');if(!r.ok)throw Error('Request failed ('+r.status+').');const u=await r.json();out.innerHTML=`<div class="profile"><img src="${u.avatar_url}" alt="${u.login} avatar"><div><h2>${u.name||u.login}</h2><p>@${u.login}</p><p>${u.bio||'No bio provided.'}</p><p>${u.followers} followers · ${u.public_repos} public repositories</p><a href="${u.html_url}" target="_blank" rel="noopener">Open profile ↗</a></div></div>`}catch(err){if(err.name!=='AbortError')out.innerHTML=`<p class="error">${err.message}</p>`}}</script></body></html>
