<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mount and Cleanup · Week 12-2</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap page"><a class="back" href="./">← Week 12-2 home</a><p class="eyebrow">EXERCISE 01 / LIFECYCLE</p><h1>Mount & cleanup</h1><p class="lead">Mount a listener, then unmount it. Cleanup runs when the component is removed.</p><section class="demo"><button id="toggle">Unmount demo</button><div id="child" class="box"></div></section><h2>Event log</h2><div id="log" class="log" aria-live="polite"></div><footer>Otgonjargal Murun · Week 12-2</footer></main><script>const child=document.querySelector('#child'),logBox=document.querySelector('#log'),button=document.querySelector('#toggle');let mounted=true,cleanup=null;function log(s){const p=document.createElement('div');p.textContent=new Date().toLocaleTimeString()+' · '+s;logBox.prepend(p)}function mount(){child.textContent='Mounted. The window resize listener is active.';const onResize=()=>log('resize event received');window.addEventListener('resize',onResize);cleanup=()=>{window.removeEventListener('resize',onResize);log('cleanup removed resize listener')};log('effect ran after mount');button.textContent='Unmount demo'}function unmount(){cleanup?.();cleanup=null;child.textContent='Component is unmounted.';button.textContent='Mount demo'}button.onclick=()=>{mounted=!mounted;mounted?mount():unmount()};mount();</script></body></html>
