<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>City Search · Week 12-2</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap page"><a class="back" href="./">← Week 12-2 home</a><p class="eyebrow">HOMEWORK 02 / GEOCODING</p><h1>Search a city</h1><p class="lead">Find a place with Open-Meteo geocoding, then fetch its current weather.</p><section class="demo"><form id="form" class="row"><input id="city" value="Seoul" placeholder="City name"><button>Search</button></form><div id="result" aria-live="polite"></div></section><footer>Otgonjargal Murun · Week 12-2</footer></main><script>let geo,weather;const out=document.querySelector('#result');document.querySelector('#form').onsubmit=async e=>{e.preventDefault();geo?.abort();weather?.abort();geo=new AbortController();out.textContent='Finding places…';try{const name=document.querySelector('#city').value.trim();if(!name)throw Error('Enter a city name.');const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=5&language=en&format=json`,{signal:geo.signal});const data=await r.json();if(!data.results?.length)throw Error('No matching city was found.');const place=data.results[0];weather=new AbortController();const w=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&current=temperature_2m,wind_speed_10m,weather_code`,{signal:weather.signal});if(!w.ok)throw Error('Could not load weather.');const d=await w.json();out.innerHTML=`<article class="weather"><div><h2>${place.name}, ${place.country||''}</h2><p class="temp">${d.current.temperature_2m} °C</p><p>Wind ${d.current.wind_speed_10m} km/h · code ${d.current.weather_code}</p></div></article>`}catch(err){if(err.name!=='AbortError')out.innerHTML=`<p class="error">${err.message}</p>`}}</script></body></html>
