<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theme Persistence · Week 12-2</title><link rel="stylesheet" href="style.css"><style>html[data-theme=light]{color-scheme:light;--bg:#eef4fb;--panel:#fff;--panel2:#f4f8fc;--line:#d5e0ed;--text:#132238;--muted:#52647c}html[data-theme=light] body{background:var(--bg)}</style></head><body><main class="wrap page"><a class="back" href="./">← Week 12-2 home</a><p class="eyebrow">EXERCISE 09 / PERSISTENCE</p><h1>Remember my theme</h1><p class="lead">Choose a theme and refresh. The choice is saved in localStorage.</p><section class="demo"><button id="toggle">Toggle theme</button><p id="status"></p></section><footer>Otgonjargal Murun · Week 12-2</footer></main><script>const key='murun-week12-theme';function apply(){const theme=localStorage.getItem(key)||'dark';document.documentElement.dataset.theme=theme;document.querySelector('#status').textContent='Saved preference: '+theme+' · reload to test persistence'}document.querySelector('#toggle').onclick=()=>{localStorage.setItem(key,(localStorage.getItem(key)||'dark')==='dark'?'light':'dark');apply()};apply()</script></body></html>
