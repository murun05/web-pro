<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Derived Values · Week 12-2</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap page"><a class="back" href="./">← Week 12-2 home</a><p class="eyebrow">EXERCISE 12 / DERIVED STATE</p><h1>Calculate, don't synchronize</h1><p class="lead">The full name can be derived directly from inputs. No effect or duplicate state is needed.</p><section class="demo"><div class="row"><label>First <input id="first" value="Mina"></label><label>Last <input id="last" value="Park"></label></div><p id="derived"></p><p id="effect"></p><p class="muted">The second example shows the extra render caused by copying derived data into state.</p></section><footer>Otgonjargal Murun · Week 12-2</footer></main><script>let direct=0,extra=0;function draw(){direct++;document.querySelector('#derived').textContent=`Derived during render: ${first.value} ${last.value} (renders ${direct})`;extra++;document.querySelector('#effect').textContent=`With effect: ${first.value} ${last.value} (updates ${extra} + effect update)`}const first=document.querySelector('#first'),last=document.querySelector('#last');first.oninput=last.oninput=draw;draw()</script></body></html>
