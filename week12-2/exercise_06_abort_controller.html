<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AbortController · Week 12-2</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap page"><a class="back" href="./">← Week 12-2 home</a><p class="eyebrow">EXERCISE 06 / REQUEST CLEANUP</p><h1>AbortController</h1><p class="lead">Search GitHub usernames. A new search cancels the previous in-flight request.</p><section class="demo"><label for="name">Username</label><input id="name" value="octocat" autocomplete="off"><button id="search">Search</button><div id="result" class="status" aria-live="polite"></div></section><footer>Otgonjargal Murun · Week 12-2</footer></main><script>let controller;const input=document.querySelector('#name'),out=document.querySelector('#result');async function search(){controller?.abort();controller=new AbortController();const name=input.value.trim();if(!name){out.textContent='Enter a username.';return}out.textContent='Loading…';try{const r=await fetch('https://api.github.com/users/'+encodeURIComponent(name),{signal:controller.signal});if(r.status===404)throw Error('Username not found.');if(!r.ok)throw Error('GitHub request failed ('+r.status+').');const u=await r.json();out.innerHTML=`<div class="profile"><img src="${u.avatar_url}" alt=""><div><h2>${u.name||u.login}</h2><p>@${u.login} · ${u.public_repos} public repositories</p></div></div>`}catch(e){if(e.name!=='AbortError')out.innerHTML=`<p class="error">${e.message}</p>`}}document.querySelector('#search').onclick=search;input.onkeydown=e=>{if(e.key==='Enter')search()};search();</script></body></html>
