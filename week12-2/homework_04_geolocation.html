<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geolocation Weather · Week 12-2</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap page"><a class="back" href="./">← Week 12-2 home</a><p class="eyebrow">HOMEWORK 04 / BONUS</p><h1>Weather near me</h1><p class="lead">Allow browser location access to request local weather; if unavailable, Seoul is used instead.</p><section class="demo"><button id="locate">Use my location</button><div id="result" aria-live="polite"></div></section><footer>Otgonjargal Murun · Week 12-2</footer></main><script>let request;const out=document.querySelector('#result');async function weather(lat,lon,label){request?.abort();request=new AbortController();out.textContent='Loading weather…';try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,wind_speed_10m,weather_code`,{signal:request.signal});if(!r.ok)throw Error('Weather could not be loaded.');const d=await r.json();out.innerHTML=`<article class="weather"><div><h2>${label}</h2><p class="temp">${d.current.temperature_2m} °C</p><p>Wind ${d.current.wind_speed_10m} km/h · code ${d.current.weather_code}</p></div></article>`}catch(e){if(e.name!=='AbortError')out.innerHTML=`<p class="error">${e.message}</p>`}}function locate(){out.textContent='Requesting location permission…';if(!navigator.geolocation){weather(37.57,126.98,'Seoul · location not supported');return}navigator.geolocation.getCurrentPosition(p=>weather(p.coords.latitude,p.coords.longitude,'Your location'),()=>weather(37.57,126.98,'Seoul · using fallback'),{timeout:8000})}document.querySelector('#locate').onclick=locate;locate()</script></body></html>
