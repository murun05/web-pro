<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Effect Loop · Week 12-2</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap page"><a class="back" href="./">← Week 12-2 home</a><p class="eyebrow">EXERCISE 11 / GOTCHA</p><h1>The effect loop</h1><p class="lead">The unsafe pattern updates its own dependency. This simulation stops after 8 runs to protect the page.</p><section class="demo"><button id="bad">Run guarded loop</button><button id="good">Run once (fixed)</button><button id="clear" class="secondary">Clear output</button><p id="value"></p><div id="log" class="log"></div></section><footer>Otgonjargal Murun · Week 12-2</footer></main><script>const log=document.querySelector('#log'),value=document.querySelector('#value');function line(s){const p=document.createElement('div');p.textContent=s;log.append(p)}document.querySelector('#bad').onclick=()=>{log.replaceChildren();let n=0;while(n<8){n++;value.textContent='Guarded count: '+n;line(`effect run ${n}; changing count triggers it again`)}line('Safety stop: an unguarded version would continue indefinitely.')};document.querySelector('#good').onclick=()=>{log.replaceChildren();value.textContent='Fixed count: 1';line('Effect ran once; functional update does not create a dependency loop.')};document.querySelector('#clear').onclick=()=>log.replaceChildren()</script></body></html>
