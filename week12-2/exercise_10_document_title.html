<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document Title · Week 12-2</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap page"><a class="back" href="./">← Week 12-2 home</a><p class="eyebrow">EXERCISE 10 / DOCUMENT SYNC</p><h1>Unread inbox</h1><p class="lead">The browser tab title is synchronized with unread message count.</p><section class="demo"><p>Unread messages: <b id="count">0</b></p><button id="new">New message</button><button id="read" class="secondary">Mark all read</button><p id="status" class="muted"></p></section><footer>Otgonjargal Murun · Week 12-2</footer></main><script>let count=0;function render(){document.querySelector('#count').textContent=count;document.title=count?`Inbox (${count}) · Week 12-2`:'Inbox · Week 12-2';document.querySelector('#status').textContent='Tab title is now: '+document.title}document.querySelector('#new').onclick=()=>{count++;render()};document.querySelector('#read').onclick=()=>{count=0;render()};render()</script></body></html>
