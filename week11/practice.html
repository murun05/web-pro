<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Interactive React practice for props, lists, state, and component children." />
  <title>Interactive Practice | Week 11</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root{color-scheme:dark;font-family:Inter,"Segoe UI",sans-serif;background:#0b0f19;color:#f8fafc}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 0%,rgba(56,189,248,.13),transparent 38rem),#0b0f19}main{width:min(1100px,calc(100% - 2rem));margin:auto;padding:3.5rem 0}.eyebrow{color:#38bdf8;font-size:.78rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(2.4rem,6vw,4rem);letter-spacing:-.06em;margin:.6rem 0}.intro{max-width:730px;color:#a7b3c5;line-height:1.7}.exercise{margin-top:1.2rem;padding:clamp(1rem,3vw,1.5rem);border:1px solid #29364a;border-radius:18px;background:linear-gradient(145deg,#172033,#101827)}.number{color:#38bdf8;font-size:.74rem;font-weight:800;letter-spacing:.13em}.exercise h2{margin:.6rem 0}.exercise>p{color:#a7b3c5;line-height:1.6}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:1rem;align-items:start}.editor,.preview,.content-card{padding:1rem;border:1px solid #2a3750;border-radius:14px;background:#0e1726}.editor{display:grid;gap:.75rem}.editor label{display:grid;gap:.35rem;color:#cbd5e1;font-size:.9rem}.editor input[type=text],.editor input[type=email]{width:100%;padding:.65rem .75rem;border:1px solid #42516a;border-radius:8px;background:#0b0f19;color:#f8fafc;font:inherit}.check{display:flex!important;align-items:center;gap:.55rem!important}.avatar{display:grid;place-items:center;width:68px;height:68px;border-radius:50%;background:#075985;color:white;font-size:1.4rem;font-weight:800}.button,.filters button{padding:.55rem .8rem;border:1px solid #42516a;border-radius:8px;background:#172033;color:#e2e8f0;font:inherit;cursor:pointer}.button:hover,.filters button:hover{border-color:#38bdf8}.filters{display:flex;flex-wrap:wrap;gap:.5rem;margin:.75rem 0}.filters button[aria-pressed=true]{background:#075985;border-color:#38bdf8}.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.6rem}.notifications{display:grid;gap:.65rem;list-style:none;padding:0}.notification{display:flex;gap:.7rem;padding:.85rem;border:1px solid #42516a;border-radius:10px;background:#111a29}.notification.read{opacity:.68}.notification p{margin:.3rem 0;color:#dbe4f0;line-height:1.5}.notification small{color:#94a3b8;text-transform:uppercase}.actions{display:flex;flex-wrap:wrap;gap:.45rem}.content-card h3{margin:0 0 .65rem}.checks{display:grid;gap:.75rem;margin:1rem 0}.progress{width:100%;accent-color:#38bdf8}.empty{padding:1rem;color:#a7b3c5;border:1px dashed #42516a;border-radius:10px}details{margin-top:1rem;color:#cbd5e1}summary{cursor:pointer;color:#7dd3fc;font-weight:700}details p{line-height:1.6}a.back{display:inline-block;margin-top:2rem;color:#7dd3fc;text-decoration:none;font-weight:700}a.back:hover{text-decoration:underline}
  </style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const initialProfile={name:'Otgonjargal Murun',role:'Computer Engineering Student',email:'murun05@gachon.ac.kr'};
const initialNotifications=[
 {id:'build',type:'success',message:'Demo: the project build finished without errors.',read:false},
 {id:'links',type:'warning',message:'Demo reminder: check your live links before submitting.',read:false},
 {id:'practice',type:'info',message:'Demo tip: change a profile prop and watch the preview.',read:true}
];
const concepts=['Pass values through props','Explain a default prop','Render a list with stable keys','Compose content with children'];
function ProfileCard({name,role,email,avatarUrl}){const initials=name.split(/\s+/).filter(Boolean).map(part=>part[0]).slice(0,2).join('').toUpperCase()||'?';return <article className="preview"><div className="avatar" role="img" aria-label={`${name} initials avatar`}>{avatarUrl||initials}</div><h3>{name||'Your name'}</h3><p>{role||'Your role'}</p><a href={`mailto:${email}`}>{email||'your@email.example'}</a></article>}
function ProfileExercise(){const [profile,setProfile]=React.useState(initialProfile);const [custom,setCustom]=React.useState(false);const update=(field,value)=>setProfile(current=>({...current,[field]:value}));return <><div className="cols"><fieldset className="editor"><legend>Edit props</legend>{[['name','Display name','text'],['role','Role','text'],['email','Email','email']].map(([key,label,type])=><label key={key}>{label}<input type={type} value={profile[key]} onChange={event=>update(key,event.target.value)}/></label>)}<label className="check"><input type="checkbox" checked={custom} onChange={event=>setCustom(event.target.checked)}/> Use custom avatar label</label><button className="button" type="button" onClick={()=>{setProfile(initialProfile);setCustom(false)}}>Reset profile</button></fieldset><div><p className="number">LIVE PREVIEW / {custom?'CUSTOM':'DEFAULT'} AVATAR</p><ProfileCard {...profile} avatarUrl={custom?'OM':undefined}/><p>Changes stay in this demo page; nothing is sent or saved.</p></div></div><details><summary>How it works</summary><p>The editor stores profile values in state and passes them as props. When avatarUrl is omitted, the component creates an initials fallback from the name.</p></details></>}
function InboxExercise(){const [items,setItems]=React.useState(initialNotifications);const [view,setView]=React.useState('All');const [counter,setCounter]=React.useState(0);const unread=items.filter(item=>!item.read).length;const visible=view==='Unread'?items.filter(item=>!item.read):items;const toggle=id=>setItems(current=>current.map(item=>item.id===id?{...item,read:!item.read}:item));return <><p role="status">{unread} unread / {items.length} demo notifications</p><div className="toolbar"><div className="filters" role="group" aria-label="Notification filter">{['All','Unread'].map(label=><button key={label} type="button" aria-pressed={view===label} onClick={()=>setView(label)}>{label}</button>)}</div><button className="button" type="button" disabled={!unread} onClick={()=>setItems(current=>current.map(item=>({...item,read:true})))}>Mark all read</button></div>{visible.length?<ul className="notifications">{visible.map(item=><li className={`notification ${item.read?'read':''}`} key={item.id}><span aria-hidden="true">{item.type==='success'?'✅':item.type==='warning'?'⚠️':'ℹ️'}</span><div><small>{item.type} · {item.read?'Read':'Unread'}</small><p>{item.message}</p><div className="actions"><button className="button" type="button" onClick={()=>toggle(item.id)}>{item.read?'Mark unread':'Mark read'}</button><button className="button" type="button" onClick={()=>setItems(current=>current.filter(row=>row.id!==item.id))}>Dismiss</button></div></div></li>)}</ul>:<p className="empty">No notifications in this view. Try All or reset the demo.</p>}<div className="actions"><button className="button" type="button" onClick={()=>{const next=counter+1;setCounter(next);setItems(current=>[...current,{id:`reminder-${next}`,type:'info',message:`Demo reminder ${next}: test one component.`,read:false}])}}>Add demo reminder</button><button className="button" type="button" disabled={!items.length} onClick={()=>setItems([])}>Clear inbox</button><button className="button" type="button" onClick={()=>{setItems(initialNotifications);setView('All')}}>Reset demo</button></div><details><summary>How it works</summary><p>Notification rows use stable IDs as keys. State controls read status and dismissal, and the Unread filter only displays unread items. All messages are fictional demo content.</p></details></>}
function Card({title,children}){return <article className="content-card"><h3>{title}</h3>{children}</article>}
function ChecklistExercise(){const [checked,setChecked]=React.useState([]);const done=checked.length;const toggle=(concept,value)=>setChecked(current=>value?[...current,concept]:current.filter(item=>item!==concept));return <><div className="cols"><Card title="Can I explain it?"><p>Tick the concepts you can explain in your own words.</p><div className="checks">{concepts.map(concept=><label className="check" key={concept}><input type="checkbox" checked={checked.includes(concept)} onChange={event=>toggle(concept,event.target.checked)}/>{concept}</label>)}</div></Card><Card title={done===concepts.length?'Ready for a walkthrough.':'One concept at a time.'}><label htmlFor="progress">{done} of {concepts.length} concepts checked</label><progress className="progress" id="progress" value={done} max={concepts.length}/><p role="status">{done===concepts.length?'Explain how one component can render different people.':'Try the controls, then trace the component props.'}</p><button className="button" type="button" disabled={!done} onClick={()=>setChecked([])}>Reset checklist</button><p>This is a personal practice checklist, not a grade or submission record.</p></Card></div><details><summary>How composition works</summary><p>The reusable Card supplies a heading and frame; its children prop contains each card's distinct checklist or progress content.</p></details></>}
function App(){return <main><span className="eyebrow">Web Programming · Week 11</span><h1>Small Components.<br/>Big Possibilities.</h1><p className="intro">Change a prop, sort the demo inbox, and check what you can explain. This interactive practice page follows the reference exercises for defaults, lists, state, and children.</p><section className="exercise"><span className="number">EXERCISE 01 / PROPS PLAYGROUND</span><h2>Make the card yours.</h2><p>Edit the fields and watch the reusable profile component update live.</p><ProfileExercise/></section><section className="exercise"><span className="number">EXERCISE 02 / DEMO INBOX</span><h2>A quieter inbox.</h2><p>Filter, mark read, dismiss, add sample reminders, or reset the fictional inbox.</p><InboxExercise/></section><section className="exercise"><span className="number">EXERCISE 03 / COMPOSITION</span><h2>Build it. Then explain it.</h2><p>The same Card wrapper holds a checklist and its live progress.</p><ChecklistExercise/></section><a className="back" href="index.html">← All Week 11 tasks</a></main>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
