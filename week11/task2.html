<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notifications</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        color: #1f2937;
      }

      .notification-panel {
        width: min(100%, 520px);
        padding: 24px;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin: 0 0 18px;
        font-size: 1.5rem;
      }

      .notification-list {
        display: grid;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .notification-item {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 14px 16px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        background: #f9fafb;
        line-height: 1.5;
      }

      .notification-icon {
        flex: 0 0 auto;
        font-size: 1.15rem;
      }

      .notification-item.success {
        border-color: #bbf7d0;
        background: #f0fdf4;
      }

      .notification-item.warning {
        border-color: #fde68a;
        background: #fffbeb;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const notifications = [
        { id: 1, type: 'success', message: 'Profile updated successfully' },
        { id: 2, type: 'warning', message: 'Password expires in 3 days' },
        { id: 3, type: 'info', message: 'New lecture materials available' },
      ];

      function NotificationItem({ type, message }) {
        const icon = type === 'success' ? '✅' : type === 'warning' ? '⚠️' : 'ℹ️';

        return (
          <li className={`notification-item ${type}`}>
            <span className="notification-icon" aria-hidden="true">{icon}</span>
            <span>{message}</span>
          </li>
        );
      }

      function NotificationList() {
        return (
          <main className="notification-panel">
            <h1>Notifications</h1>
            <ul className="notification-list">
              {notifications.map((notification) => (
                <NotificationItem
                  key={notification.id}
                  type={notification.type}
                  message={notification.message}
                />
              ))}
            </ul>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<NotificationList />);
    </script>
  </body>
</html>
