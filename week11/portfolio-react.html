<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="React portfolio gallery with technology filters and project detail dialogs." />
  <title>Selected Work | Week 11</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root{color-scheme:dark;font-family:Inter,"Segoe UI",sans-serif;background:#0b0f19;color:#f8fafc}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 0%,rgba(56,189,248,.13),transparent 38rem),#0b0f19}main{width:min(1080px,calc(100% - 2rem));margin:auto;padding:3.5rem 0}.eyebrow{color:#38bdf8;font-size:.78rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(2.5rem,7vw,4.5rem);letter-spacing:-.06em;margin:.6rem 0}.intro{max-width:700px;color:#a7b3c5;line-height:1.7}.filters{display:flex;flex-wrap:wrap;gap:.6rem;margin:1.7rem 0}.filter{padding:.6rem .9rem;border:1px solid #29364a;border-radius:999px;background:#111a29;color:#dbeafe;font:inherit;cursor:pointer}.filter[aria-pressed=true]{background:#075985;border-color:#38bdf8;color:white}.count{color:#94a3b8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:1rem}.project{display:flex;flex-direction:column;min-height:260px;padding:1.35rem;border:1px solid #29364a;border-radius:18px;background:linear-gradient(145deg,#172033,#0f172a);transition:transform .2s,border-color .2s}.project:hover{transform:translateY(-3px);border-color:#38bdf8}.mark{display:flex;align-items:center;justify-content:space-between;color:#38bdf8;font-size:.75rem;font-weight:800;letter-spacing:.12em}.mark b{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:#0b2940;font-size:1.1rem}.project h2{margin:1rem 0 .55rem}.project p{color:#a7b3c5;line-height:1.6}.tags{display:flex;flex-wrap:wrap;gap:.45rem;list-style:none;margin:0;padding:0}.tags li{padding:.3rem .6rem;border:1px solid #24516b;border-radius:999px;background:#0c2434;color:#bae6fd;font-size:.76rem}.actions{display:flex;flex-wrap:wrap;gap:.9rem;margin-top:auto;padding-top:1.2rem}.actions button,.actions a{padding:0;border:0;background:none;color:#7dd3fc;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}.empty{padding:2rem 0;color:#a7b3c5}dialog{width:min(560px,calc(100% - 2rem));border:1px solid #3b506b;border-radius:18px;padding:1.5rem;background:#111a29;color:#f8fafc;box-shadow:0 24px 80px #0009}dialog::backdrop{background:#020617cc}dialog p{color:#cbd5e1;line-height:1.7}.close{padding:.6rem .9rem;border:1px solid #42516a;border-radius:8px;background:#172033;color:white;font:inherit;cursor:pointer}a.back{display:inline-block;margin-top:2rem;color:#7dd3fc;text-decoration:none;font-weight:700}a.back:hover{text-decoration:underline}
  </style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const projects=[
 {id:'week11-gallery',title:'Week 11 React Gallery',description:'A portfolio gallery built with reusable React cards, live technology filtering, and a detail dialog.',technologies:['React','HTML','CSS'],mark:'01 / BUILD',details:'This exercise demonstrates a ProjectCard, a filtered project list, React state, stable project IDs, and accessible project details.',source:'https://github.com/murun05/web-pro/tree/main/week11',demo:'homework.html'},
 {id:'web-pro',title:'Web Pro Portfolio',description:'The main coursework portfolio, presenting weekly web programming exercises.',technologies:['HTML','CSS'],mark:'02 / PORTFOLIO',details:'The repository portfolio links the coursework pages and shows the progression of the Web Programming projects.',source:'https://github.com/murun05/web-pro',demo:'../index.html'},
 {id:'project-gallery',title:'Project Gallery',description:'A separate filterable gallery page with project cards and technology tags.',technologies:['React','JavaScript','CSS'],mark:'03 / EXPLORE',details:'This gallery practice page focuses on mapping project data to reusable cards, filtering by technology, and displaying extra details in a dialog.',source:'https://github.com/murun05/web-pro/blob/main/week11/homework.html',demo:'homework.html'}
];
function ProjectCard({project,onDetails}){return <article className="project"><div className="mark"><span>{project.mark}</span><b aria-hidden="true">{project.title.split(/\s+/).map(word=>word[0]).slice(0,2).join('')}</b></div><h2>{project.title}</h2><p>{project.description}</p><ul className="tags" aria-label={`${project.title} technologies`}>{project.technologies.map(tech=><li key={tech}>{tech}</li>)}</ul><div className="actions"><button type="button" onClick={()=>onDetails(project)}>Project details ↗</button><a href={project.source} target="_blank" rel="noreferrer">Source ↗</a><a href={project.demo}>Demo ↗</a></div></article>}
function App(){const [selected,setSelected]=React.useState('All');const [active,setActive]=React.useState(null);const technologies=['All',...new Set(projects.flatMap(project=>project.technologies))];const visible=selected==='All'?projects:projects.filter(project=>project.technologies.includes(selected));const dialogRef=React.useRef(null);React.useEffect(()=>{if(active&&dialogRef.current&&!dialogRef.current.open)dialogRef.current.showModal();},[active]);function close(){if(dialogRef.current?.open)dialogRef.current.close();setActive(null)}return <main><span className="eyebrow">Web Programming · Week 11 / React</span><h1>Selected Work<span style={{color:'#38bdf8'}}>.</span></h1><p className="intro">Reusable project cards, technology filters, and detail dialogs. The entries below link to this Web Pro coursework portfolio and its Week 11 exercises.</p><nav className="filters" aria-label="Filter projects by technology">{technologies.map(tech=><button className="filter" key={tech} type="button" aria-pressed={selected===tech} onClick={()=>setSelected(tech)}>{tech}</button>)}</nav><p className="count" role="status" aria-live="polite">Showing {visible.length} {visible.length===1?'project':'projects'}</p>{visible.length?<section className="grid" aria-label="Portfolio projects">{visible.map(project=><ProjectCard key={project.id} project={project} onDetails={setActive}/>)}</section>:<p className="empty">No projects match this technology.</p>}<dialog ref={dialogRef} onClose={()=>setActive(null)} aria-labelledby="dialog-title">{active&&<><span className="eyebrow">{active.mark}</span><h2 id="dialog-title">{active.title}</h2><p>{active.details}</p><ul className="tags" aria-label="Technologies">{active.technologies.map(tech=><li key={tech}>{tech}</li>)}</ul><button className="close" type="button" style={{marginTop:'1.4rem'}} onClick={close}>Close details</button></>}</dialog><a className="back" href="index.html">← All Week 11 tasks</a></main>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
