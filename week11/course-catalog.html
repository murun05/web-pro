<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Course catalog built with React." />
    <title>Course Catalog | Week 11</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f19;
        --panel: #121b2b;
        --panel-alt: #172033;
        --line: #2a3750;
        --text: #f8fafc;
        --muted: #a7b3c5;
        --brand: #38bdf8;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(ellipse at 12% 0%, rgba(56, 189, 248, 0.13), transparent 38rem), var(--bg);
        color: var(--text);
        font-family: Inter, "Segoe UI", sans-serif;
      }
      main {
        width: min(1000px, calc(100% - 2rem));
        margin: 0 auto;
        padding: 4rem 0;
      }
      .eyebrow {
        color: var(--brand);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0.7rem 0 0.8rem;
        font-size: clamp(2.2rem, 6vw, 4rem);
        letter-spacing: -0.06em;
      }
      .intro {
        max-width: 700px;
        color: var(--muted);
        line-height: 1.7;
      }
      .catalog {
        margin-top: 2rem;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
        gap: 1rem;
      }
      .course {
        padding: 1.3rem;
        border-radius: 18px;
        border: 1px solid var(--line);
        background: linear-gradient(145deg, var(--panel-alt), var(--panel));
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.38rem 0.7rem;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 0.8rem;
      }
      .required {
        background: rgba(56, 189, 248, 0.12);
        color: #7dd3fc;
        border: 1px solid rgba(56, 189, 248, 0.35);
      }
      .elective {
        background: rgba(167, 139, 250, 0.12);
        color: #c4b5fd;
        border: 1px solid rgba(167, 139, 250, 0.35);
      }
      .course h2 {
        margin: 0 0 0.6rem;
        font-size: 1.2rem;
      }
      .course p {
        margin: 0.45rem 0;
        color: var(--muted);
      }
      a {
        display: inline-block;
        margin-top: 2rem;
        color: #7dd3fc;
        text-decoration: none;
        font-weight: 700;
      }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const courses = [
        { id: 'cs101', title: 'Introduction to Programming', instructor: 'Course Team', credits: 3, required: true },
        { id: 'web210', title: 'Web Programming', instructor: 'Course Team', credits: 3, required: true },
        { id: 'ui140', title: 'Interface Design', instructor: 'Course Team', credits: 2, required: false },
        { id: 'data205', title: 'Data Fundamentals', instructor: 'Course Team', credits: 3, required: false }
      ];

      function CourseCard({ course }) {
        return (
          <article className="course">
            <span className={`badge ${course.required ? 'required' : 'elective'}`}>
              {course.required ? 'Required' : 'Elective'}
            </span>
            <h2>{course.title}</h2>
            <p>Instructor: {course.instructor}</p>
            <p>{course.credits} credits</p>
          </article>
        );
      }

      function App() {
        return (
          <main>
            <span className="eyebrow">Week 11 · Exercise 02</span>
            <h1>Course Catalog</h1>
            <p className="intro">
              Course cards are generated from a data array using <code>.map()</code>. Each item has a stable key,
              and the required/elective badge is conditionally rendered based on the course type.
            </p>
            <section className="catalog" aria-label="Course catalog">
              {courses.map((course) => (
                <CourseCard key={course.id} course={course} />
              ))}
            </section>
            <a href="index.html">← Back to all Week 11 tasks</a>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
