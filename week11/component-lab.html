<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Component lab with greetings, lists, alerts, and grade board." />
    <title>Component Lab | Week 11</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f19;
        --panel: #121b2b;
        --panel-alt: #172033;
        --line: #2a3750;
        --text: #f8fafc;
        --muted: #a7b3c5;
        --brand: #38bdf8;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(ellipse at 12% 0%, rgba(56, 189, 248, 0.13), transparent 38rem), var(--bg);
        color: var(--text);
        font-family: Inter, "Segoe UI", sans-serif;
      }
      main {
        width: min(1000px, calc(100% - 2rem));
        margin: 0 auto;
        padding: 4rem 0;
      }
      .eyebrow {
        color: var(--brand);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0.8rem 0 0.8rem;
        font-size: clamp(2.2rem, 6vw, 4rem);
        letter-spacing: -0.06em;
      }
      .intro {
        max-width: 720px;
        color: var(--muted);
        line-height: 1.7;
      }
      .grid {
        margin-top: 2rem;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
        gap: 1rem;
      }
      .panel {
        padding: 1.3rem;
        border-radius: 18px;
        border: 1px solid var(--line);
        background: linear-gradient(145deg, var(--panel-alt), var(--panel));
      }
      .panel h2 {
        margin: 0 0 1rem;
        font-size: 1.1rem;
      }
      .student-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.7rem;
      }
      .student-list li {
        padding: 0.75rem 0.85rem;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.9);
        color: #dfeaf8;
      }
      .alert {
        margin: 0.4rem 0;
        padding: 0.8rem 1rem;
        border-radius: 12px;
        line-height: 1.5;
      }
      .alert.info {
        border: 1px solid rgba(59, 130, 246, 0.5);
        background: rgba(37, 99, 235, 0.13);
        color: #dbeafe;
      }
      .alert.warning {
        border: 1px solid rgba(251, 146, 60, 0.45);
        background: rgba(146, 64, 14, 0.18);
        color: #fcd34d;
      }
      .grades {
        width: 100%;
        border-collapse: collapse;
      }
      .grades th, .grades td {
        padding: 0.7rem 0.5rem;
        text-align: left;
        border-bottom: 1px solid var(--line);
      }
      .result.pass { color: #86efac; font-weight: 700; }
      .result.fail { color: #fca5a5; font-weight: 700; }
      a {
        display: inline-block;
        margin-top: 2rem;
        color: #7dd3fc;
        text-decoration: none;
        font-weight: 700;
      }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const students = [
        { id: 's1', name: 'Otgonjargal Murun', program: 'Computer Engineering' },
        { id: 's2', name: 'Sample Student One', program: 'Web Programming' },
        { id: 's3', name: 'Sample Student Two', program: 'Computer Science' }
      ];

      const grades = [
        { id: 'g1', name: 'Student A', score: 92 },
        { id: 'g2', name: 'Student B', score: 74 },
        { id: 'g3', name: 'Student C', score: 58 }
      ];

      function Greeting({ name }) {
        return <p>Hello, {name}! Welcome to the component lab.</p>;
      }

      function StudentList({ items }) {
        return (
          <ul className="student-list">
            {items.map((student) => (
              <li key={student.id}>
                <strong>{student.name}</strong><br />
                {student.program}
              </li>
            ))}
          </ul>
        );
      }

      function Alert({ type, children }) {
        return <div className={`alert ${type}`}>{children}</div>;
      }

      function GradeBoard({ items, passingScore = 60 }) {
        return (
          <table className="grades">
            <thead>
              <tr>
                <th>Student</th>
                <th>Score</th>
                <th>Result</th>
              </tr>
            </thead>
            <tbody>
              {items.map((item) => {
                const passed = item.score >= passingScore;
                return (
                  <tr key={item.id}>
                    <td>{item.name}</td>
                    <td>{item.score}%</td>
                    <td className={`result ${passed ? 'pass' : 'fail'}`}>
                      {passed ? 'Pass' : 'Needs practice'}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        );
      }

      function App() {
        return (
          <main>
            <span className="eyebrow">Week 11 · Exercise 06</span>
            <h1>Component Lab</h1>
            <p className="intro">
              This page demonstrates reusable components using props, array rendering, conditional UI,
              and children content. The grade values are example practice data.
            </p>
            <section className="grid" aria-label="Component examples">
              <article className="panel">
                <h2>Greeting</h2>
                <Greeting name="Otgonjargal" />
                <Greeting name="Web Programming" />
              </article>

              <article className="panel">
                <h2>Student list</h2>
                <StudentList items={students} />
              </article>

              <article className="panel">
                <h2>Alerts</h2>
                <Alert type="info">Your component lab is ready.</Alert>
                <Alert type="warning">This is a sample warning message.</Alert>
              </article>

              <article className="panel">
                <h2>Grade board</h2>
                <GradeBoard items={grades} passingScore={60} />
              </article>
            </section>
            <a href="index.html">← Back to all Week 11 tasks</a>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
