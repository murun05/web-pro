<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Gallery | OTGONJARGAL MURUN ID-202539440</title>
  
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      min-height: 100vh;
      position: relative;
    }
    .team-badge {
      position: absolute;
      top: 1.5rem;
      right: 2rem;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 0.6rem 1rem;
      border-radius: 0.75rem;
      font-size: 0.8rem;
      color: #38bdf8;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      text-align: right;
      z-index: 10;
    }
    .gallery-shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 5rem 2rem 2rem;
    }
    .eyebrow {
      color: #38bdf8;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: block;
      margin-bottom: 0.75rem;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
    }
    .intro {
      color: #94a3b8;
      font-size: 1.05rem;
      margin-bottom: 2rem;
    }
    .filter-area {
      margin-bottom: 2rem;
    }
    .filter-label {
      display: block;
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
    }
    .filter-bar {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .filter-button {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    .filter-button:hover, .filter-button[aria-pressed="true"] {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
    }
    .results-count {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .project-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 1rem;
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s;
    }
    .project-card:hover {
      border-color: #38bdf8;
    }
    .project-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #f8fafc;
    }
    .project-desc {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .tech-tags {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .tech-tag {
      background: #1e293b;
      color: #38bdf8;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .project-links {
      display: flex;
      gap: 1rem;
    }
    .project-links a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .project-links a:hover {
      text-decoration: underline;
    }
    .back-link {
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      display: inline-block;
      margin-top: 1rem;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    .empty-state {
      color: #94a3b8;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="team-badge">
    <span><strong>Otgonjargal Murun</strong>: 202539440</span>
   
  </div>

  <div id="root"></div>

  <script type="text/babel">
    const projects = [
      {
     {
        title: 'Student Directory',
        description: 'A React student directory with reusable profile cards and custom styling.',
        techStack: ['React', 'CSS'],
        githubLink: 'https://github.com/murun05/task11',
        demoLink: 'https://murun05.github.io/task11/'
      },
      {
        title: 'Book Search App',
        description: 'A browser-based book search project from the Web Programming coursework.',
        techStack: ['HTML', 'CSS', 'JavaScript'],
        githubLink: 'https://github.com/murun05/webpro-book-search.',
        demoLink: 'https://murun05.github.io/webpro-book-search./'
      },
      {
        title: 'Personal Portfolio',
        description: 'A personal portfolio website presenting skills and course projects.',
        techStack: ['HTML', 'CSS'],
        githubLink: 'https://github.com/murun05/portfolio',
        demoLink: 'https://murun05.github.io/portfolio/'
      }
    ];

    function ProjectCard({ title, description, techStack, githubLink, demoLink }) {
      return (
        <article className="project-card">
          <div>
            <h3 className="project-title">{title}</h3>
            <p className="project-desc">{description}</p>
            <div className="tech-tags">
              {techStack.map((tech) => (
                <span className="tech-tag" key={tech}>{tech}</span>
              ))}
            </div>
          </div>
          <div className="project-links">
            <a href={githubLink} target="_blank" rel="noreferrer">GitHub ↗</a>
            <a href={demoLink} target="_blank" rel="noreferrer">Live demo ↗</a>
          </div>
        </article>
      );
    }

    function FilterBar({ technologies, selected, onSelect }) {
      return (
        <nav className="filter-bar" aria-label="Filter projects by technology">
          {['All', ...technologies].map((technology) => (
            <button
              className="filter-button"
              key={technology}
              type="button"
              aria-pressed={selected === technology}
              onClick={() => onSelect(technology)}
            >
              {technology}
            </button>
          ))}
        </nav>
      );
    }

    function ProjectList({ items }) {
      if (items.length === 0) {
        return <p className="empty-state">No projects use this technology yet.</p>;
      }
      return (
        <div className="project-grid">
          {items.map((project) => (
            <ProjectCard key={project.title} {...project} />
          ))}
        </div>
      );
    }

    function App() {
      const [selectedTechnology, setSelectedTechnology] = React.useState('All');
      const technologies = [...new Set(projects.flatMap((project) => project.techStack))].sort();
      const visibleProjects = selectedTechnology === 'All'
        ? projects
        : projects.filter((project) => project.techStack.includes(selectedTechnology));

      return (
        <main className="gallery-shell">
          <span className="eyebrow">Web Programming · Portfolio</span>
          <h1>Project Gallery</h1>
          <p className="intro">A selection of my projects. Choose a technology to filter the gallery.</p>
          
          <section className="filter-area" aria-label="Project filters">
            <span className="filter-label">Filter by technology</span>
            <FilterBar
              technologies={technologies}
              selected={selectedTechnology}
              onSelect={setSelectedTechnology}
            />
          </section>

          <p className="results-count" aria-live="polite">
            Showing {visibleProjects.length} {visibleProjects.length === 1 ? 'project' : 'projects'}
          </p>

          <ProjectList items={visibleProjects} />

          <a className="back-link" href="https://murun05.github.io/web-pro/">← Back to Web Pro portfolio</a>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
