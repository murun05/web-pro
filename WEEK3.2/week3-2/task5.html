<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      padding-top: 60px; 
      background-color: #f8fafc;
      color: #334155;
    }

    .nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background-color: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      z-index: 1000;
    }

    .logo {
      color: #ffffff;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      list-style: none;
    }

    .nav-links a {
      color: #ffffff;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: #14b8a6;
    }

    .content {
      padding: 40px 24px;
      min-height: 200vh; 
    }

    .content h1 {
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="logo">MyBrand</div>
    <ul class="nav-links">
      <li><a href="#home">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#services">Services</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <div class="content">
    <h1>Fixed Navigation Bar Demo</h1>
    <p>Scroll down to see the navigation bar stay pinned to the top of the viewport.</p>
  </div>

</body>
</html>
