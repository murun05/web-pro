<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Portfolio</title>
  <style>
    /* 1. CSS Variables in :root with Dark Mode support */
    :root {
      --bg-color: #f0fdfa;
      --card-bg: #ffffff;
      --text-color: #0f766e;
      --accent-color: #14b8a6;
      --nav-bg: #0f766e;
      --nav-text: #ffffff;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #051a0a;
        --card-bg: #0b2017;
        --text-color: #d4edda;
        --accent-color: #14b8a6;
        --nav-bg: #031007;
        --nav-text: #d4edda;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      padding-top: 60px;
    }

    /* 2. Fixed Navigation Bar */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background-color: var(--nav-bg);
      color: var(--nav-text);
      display: flex;
      align-items: center;
      justify-content: space-between;
   padding: 0 24px;
      z-index: 1000;
    }

    nav .logo {
      font-weight: bold;
      font-size: 1.2rem;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 16px;
    }

    nav a {
      color: var(--nav-text);
      text-decoration: none;
    }

    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero {
      padding: 60px 24px;
      text-align: center;
      animation: fadeIn 1s ease-out forwards;
    }

    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 8px;
    }

    .hero p {
      font-size: 1.2rem;
      opacity: 0.9;
    }

    .skills-section {
      padding: 24px;
      max-width: 900px;
      margin: 0 auto;
    }

    /* 5. Sticky Section Heading */
    .sticky-h2 {
      position: sticky;
      top: 60px;
      background-color: var(--bg-color);
      padding: 12px 0;
      margin-bottom: 20px;
      z-index: 10;
      border-bottom: 2px solid var(--accent-color);
    }

    
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    
    .card {
      background-color: var(--card-bg);
      border: 2px solid var(--accent-color);
      border-radius: 12px;
      padding: 24px;
      box-shadow: var(--shadow);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      font-size: 1.1rem;
      font-weight: 500;
    }

    .card::before {
      content: attr(data-icon) " ";
      margin-right: 8px;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.2);
    }

    .spacer {
      height: 400px;
    }
  </style>
</head>
<body>


  <nav>
    <div class="logo">My Portfolio</div>
    <ul>
      <li><a href="#about">About</a></li>
      <li><a href="#skills">Skills</a></li>
    </ul>
  </nav>


  <section class="hero" id="about">
    <h1>Hello, I'm Otgonjargal Murun</h1>
    <p>Computer Engineering Major · Gachon University · week 3_2 css</p>
  </section>

  
  <section class="skills-section" id="skills">
    <h2 class="sticky-h2">My Skills</h2>
    <div class="grid">
      <div class="card" data-icon="🧠">Problem Solving</div>
      <div class="card" data-icon="🤝">Teamwork</div>
      <div class="card" data-icon="💬">Communication</div>
      <div class="card" data-icon="📚">Continuous Learning</div>
      <div class="card" data-icon="⏱️">Time Management</div>
      <div class="card" data-icon="🎯">Project Planning</div>
    </div>
    <div class="spacer"></div>
  </section>

</body>
</html>
