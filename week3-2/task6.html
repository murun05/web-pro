<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg: #f0fdfa;
      --card-bg: #ffffff;
      --card-border: #14b8a6;
      --text: #0f766e;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #051a0a;
        --card-bg: #0b2017;
        --card-border: #14b8a6;
        --text: #d4edda;
      }
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: sans-serif;
      padding: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .card {
      background-color: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
    }

    .card::before {
      content: attr(data-icon) " ";
      font-size: 1.2em;
      margin-right: 6px;
    }
  </style>
</head>
<body>

  <div class="grid">
    <div class="card" data-icon="🌐">HTML5 – Structure</div>
    <div class="card" data-icon="🎨">CSS3 – Styling</div>
    <div class="card" data-icon="⚡">JavaScript – Behaviour</div>
    <div class="card" data-icon="📐">Flexbox – 1D Layout</div>
    <div class="card" data-icon="🔳">Grid – 2D Layout</div>
    <div class="card" data-icon="📱">Responsive – Any Screen</div>
  </div>

</body>
</html>
