<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { padding: 40px; background: #f0fdfa; }

    .card {
      width: 280px;
      height: 160px;
      background: white;
      border: 2px solid #14b8a6;
      border-radius: 12px;
      padding: 20px;
      color: #0f766e;
      font-family: sans-serif;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 24px rgba(20, 184, 166, 0.3);
    }
  </style>
</head>
<body>
  <div class="card">
    <h3>Hover Me</h3>
  </div>
</body>
</html>
