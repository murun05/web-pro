<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    
    :root {
      --primary: #0f766e;
      --accent: #14b8a6;
      --bg: #f0fdfa;
      --text: #1e293b;
      --radius: 12px;
    }

    
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #14b8a6;
        --accent: #2dd4bf;
        --bg: #0f172a;
        --text: #f8fafc;
      }
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: sans-serif;
      padding: 40px;
    }

    .btn {
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: var(--radius);
      cursor: pointer;
    }

    .card {
      background-color: var(--bg);
      border: 2px solid var(--accent);
      border-radius: var(--radius);
      padding: 20px;
      margin-top: 16px;
      color: var(--text);
    }
  </style>
</head>
<body>
  <button class="btn">Click Me</button>
  <div class="card">A themed card using CSS variables</div>
</body>
</html>
