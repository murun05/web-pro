<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokémon HUD Explorer</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: #090d16;
  color: #f1f5f9;
  margin: 0;
  padding: 30px;
}

main {
  max-width: 900px;
  margin: auto;
}

header {
  text-align: center;
  margin-bottom: 30px;
}

h1 {
  color: #38bdf8;
  font-size: 2.75rem;
  margin-bottom: 8px;
  letter-spacing: -0.5px;
}

header p {
  color: #94a3b8;
  font-size: 1.1rem;
}

form {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin: 25px 0;
}

input, button {
  padding: 14px 20px;
  border-radius: 12px;
  font-size: 16px;
  outline: none;
}

input {
  border: 1px solid #1e293b;
  background: #0f172a;
  color: #f1f5f9;
  min-width: 260px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

input:focus {
  border-color: #38bdf8;
  box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
}

button {
  background: #0284c7;
  color: white;
  border: 0;
  cursor: pointer;
  font-weight: 600;
  transition: background 0.2s, transform 0.1s;
}

button:hover {
  background: #0ea5e9;
}

button:active {
  transform: scale(0.98);
}

button:disabled {
  opacity: 0.5;
  cursor: wait;
}

#status {
  text-align: center;
  min-height: 24px;
  font-weight: 500;
  color: #94a3b8;
  margin: 20px 0;
}

.card {
  background: #0f172a;
  border: 1px solid #1e293b;
  border-radius: 20px;
  padding: 30px;
  margin-top: 25px;
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 30px;
  align-items: center;
  animation: fadeIn 0.3s ease-in-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.card-left {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  background: #090d16;
  padding: 25px;
  border-radius: 16px;
  border: 1px solid #1e293b;
}

.card img {
  width: 180px;
  height: 180px;
  object-fit: contain;
  filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
  margin-bottom: 15px;
}

.card h2 {
  font-size: 1.75rem;
  text-transform: capitalize;
  color: #f8fafc;
  margin: 0 0 12px 0;
}

.types {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}

.type {
  background: #1e293b;
  color: #38bdf8;
  padding: 6px 14px;
  border-radius: 20px;
  font-weight: 600;
  font-size: 0.85rem;
  text-transform: capitalize;
  border: 1px solid #334155;
}

.card-right {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.abilities {
  background: #090d16;
  padding: 14px 18px;
  border-radius: 12px;
  font-size: 0.95rem;
  color: #cbd5e1;
  text-transform: capitalize;
  border: 1px solid #1e293b;
}

.stats-title {
  font-weight: 700;
  color: #f8fafc;
  font-size: 1.1rem;
  margin-bottom: -10px;
}

.stats {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.stat {
  background: #090d16;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid #1e293b;
}

.stat-info {
  display: flex;
  justify-content: space-between;
  margin-bottom: 6px;
  font-size: 0.9rem;
  text-transform: capitalize;
}

.stat-info span {
  color: #94a3b8;
}

.stat-info strong {
  color: #f1f5f9;
}

.stat-bar-bg {
  background: #1e293b;
  border-radius: 6px;
  height: 6px;
  width: 100%;
  overflow: hidden;
}

.stat-bar-fill {
  background: linear-gradient(90deg, #0ea5e9, #38bdf8);
  height: 100%;
  border-radius: 6px;
  transition: width 0.4s ease;
}

@media (max-width: 768px) {
  .card {
    grid-template-columns: 1fr;
  }
  body {
    padding: 15px;
  }
  h1 {
    font-size: 2.2rem;
  }
  form {
    flex-direction: column;
  }
  input, button {
    width: 100%;
  }
}
</style>
</head>

<body>
<main>
  <header>
    <h1>⚡ Pokémon HUD Explorer</h1>
    <p>Access neural database logs for any Pokémon entity.</p>
  </header>

  <form id="searchForm">
    <input id="pokemonName" placeholder="Enter name or ID (e.g. charizard)" value="charizard" required>
    <button id="searchBtn" type="submit">Query Data</button>
    <button type="button" id="randomBtn">Random Scan</button>
  </form>

  <p id="status">Initializing connection...</p>
  <section id="result"></section>
</main>

<script>
const input = document.getElementById("pokemonName");
const result = document.getElementById("result");
const statusEl = document.getElementById("status");
const searchBtn = document.getElementById("searchBtn");

async function loadPokemon(value) {
  const name = value.trim().toLowerCase();
  if (!name) return;

  searchBtn.disabled = true;
  statusEl.textContent = "Querying PokéAPI database...";
  result.replaceChildren();

  try {
    const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${encodeURIComponent(name)}`);
    if (!response.ok) throw new Error("Entity not found");

    const p = await response.json();

    const card = document.createElement("article");
    card.className = "card";

    // Left Column: Image, Name, Types
    const leftDiv = document.createElement("div");
    leftDiv.className = "card-left";

    const image = document.createElement("img");
    image.src = p.sprites.other["official-artwork"].front_default || p.sprites.front_default || "";
    image.alt = p.name;

    const title = document.createElement("h2");
    title.textContent = `#${p.id} ${p.name}`;

    const types = document.createElement("div");
    types.className = "types";
    p.types.forEach(item => {
      const badge = document.createElement("span");
      badge.className = "type";
      badge.textContent = item.type.name;
      types.appendChild(badge);
    });

    leftDiv.append(image, title, types);

    // Right Column: Abilities & Stats
    const rightDiv = document.createElement("div");
    rightDiv.className = "card-right";

    const abilities = document.createElement("div");
    abilities.className = "abilities";
    abilities.textContent = "Abilities: " + p.abilities.map(a => a.ability.name.replaceAll("-", " ")).join(", ");

    const statsTitle = document.createElement("div");
    statsTitle.className = "stats-title";
    statsTitle.textContent = "Base Stat Metrics";

    const stats = document.createElement("div");
    stats.className = "stats";

    p.stats.forEach(item => {
      const box = document.createElement("div");
      box.className = "stat";

      const info = document.createElement("div");
      info.className = "stat-info";

      const label = document.createElement("span");
      label.textContent = item.stat.name.replaceAll("-", " ");

      const val = document.createElement("strong");
      val.textContent = item.base_stat;

      info.append(label, val);

      const barBg = document.createElement("div");
      barBg.className = "stat-bar-bg";

      const barFill = document.createElement("div");
      barFill.className = "stat-bar-fill";
      const percentage = Math.min(100, (item.base_stat / 200) * 100);
      barFill.style.width = percentage + "%";

      barBg.appendChild(barFill);
      box.append(info, barBg);
      stats.appendChild(box);
    });

    rightDiv.append(abilities, statsTitle, stats);

    card.append(leftDiv, rightDiv);
    result.appendChild(card);
    statusEl.textContent = "Data retrieval successful.";

  } catch (error) {
    statusEl.textContent = "Entity not found in database. Verify name or ID.";
  } finally {
    searchBtn.disabled = false;
  }
}

document.getElementById("searchForm").addEventListener("submit", event => {
  event.preventDefault();
  loadPokemon(input.value);
});

document.getElementById("randomBtn").addEventListener("click", () => {
  const id = Math.floor(Math.random() * 1025) + 1;
  input.value = id;
  loadPokemon(id);
});

loadPokemon("charizard");
</script>
</body>
</html>
