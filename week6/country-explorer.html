<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Country Explorer</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #f8fafc;
  color: #1e293b;
  margin: 0;
  padding: 30px;
}

main {
  max-width: 1300px;
  margin: auto;
}

header {
  text-align: center;
  margin-bottom: 35px;
}

h1 {
  color: #4f46e5;
  font-size: 2.75rem;
  margin-bottom: 10px;
}

header p {
  font-size: 1.15rem;
  color: #64748b;
}

.controls {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin: 25px 0;
  justify-content: center;
}

input, select, button {
  padding: 14px 18px;
  border-radius: 12px;
  font-size: 16px;
  outline: none;
}

input, select {
  border: 1px solid #cbd5e1;
  background: white;
  color: #1e293b;
  transition: border-color 0.2s, box-shadow 0.2s;
}

input:focus, select:focus {
  border-color: #4f46e5;
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
}

input {
  flex: 1;
  min-width: 220px;
}

button {
  background: #4f46e5;
  color: white;
  border: 0;
  cursor: pointer;
  font-weight: 600;
  transition: background 0.2s, transform 0.1s;
}

button:hover {
  background: #4338ca;
}

button:active {
  transform: scale(0.98);
}

button:disabled {
  opacity: 0.6;
  cursor: wait;
}

#status {
  text-align: center;
  font-weight: 500;
  color: #475569;
  min-height: 24px;
  margin: 20px 0;
}

.error {
  color: #dc2626 !important;
}

#countries {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
  margin-top: 25px;
}

.card {
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 12px 25px -5px rgba(79, 70, 229, 0.12);
}

.card img {
  display: block;
  width: 100%;
  height: 160px;
  object-fit: contain;
  background: #f1f5f9;
  padding: 12px;
  border-bottom: 1px solid #f1f5f9;
}

.details {
  padding: 20px;
  overflow-wrap: anywhere;
}

.details h2 {
  margin-top: 0;
  margin-bottom: 12px;
  color: #1e293b;
  font-size: 1.25rem;
}

.details p {
  line-height: 1.5;
  color: #64748b;
  margin: 6px 0;
  font-size: 0.95rem;
}

footer {
  text-align: center;
  margin-top: 45px;
  color: #94a3b8;
  font-size: 14px;
}

@media (max-width: 600px) {
  body {
    padding: 15px;
  }

  h1 {
    font-size: 2rem;
  }

  .controls {
    flex-direction: column;
  }

  input, select, button {
    width: 100%;
  }
}
</style>
</head>

<body>
<main>
  <header>
    <h1>🌍 Country Explorer</h1>
    <p>Explore flags, capitals, population, regions, and currencies.</p>
  </header>

  <div class="controls">
    <input
      id="search"
      type="search"
      placeholder="Search a country..."
      aria-label="Search countries"
    >

    <select id="region" aria-label="Filter by region">
      <option value="">All regions</option>
      <option value="Africa">Africa</option>
      <option value="Americas">Americas</option>
      <option value="Asia">Asia</option>
      <option value="Europe">Europe</option>
      <option value="Oceania">Oceania</option>
    </select>

    <select id="sort" aria-label="Sort countries">
      <option value="name">Sort: A to Z</option>
      <option value="population-desc">Population: High to Low</option>
      <option value="population-asc">Population: Low to High</option>
    </select>

    <button id="load">Load Countries</button>
  </div>

  <p id="status" role="status" aria-live="polite">
    Loading countries...
  </p>

  <section id="countries"></section>

  <footer>
    Country Explorer — powered by countries.dev
  </footer>
</main>

<script>
const API =
  "https://countries.dev/countries?fields=name,capital,region,flags,population,currencies,flag";

const countriesEl = document.getElementById("countries");
const statusEl = document.getElementById("status");
const loadBtn = document.getElementById("load");
const searchEl = document.getElementById("search");
const regionEl = document.getElementById("region");
const sortEl = document.getElementById("sort");

let allCountries = [];

async function loadCountries() {
  loadBtn.disabled = true;
  statusEl.className = "";
  statusEl.textContent = "Loading countries...";
  countriesEl.replaceChildren();

  try {
    const response = await fetch(API);

    if (!response.ok) {
      throw new Error(`HTTP error ${response.status}`);
    }

    const result = await response.json();

    const records = Array.isArray(result)
      ? result
      : result.countries || result.data || [];

    if (!Array.isArray(records) || records.length === 0) {
      throw new Error("The API returned no country records.");
    }

    allCountries = records.map(country => ({
      name: {
        common:
          country.name?.common ||
          country.name ||
          country.commonName ||
          "Unknown country"
      },
      capital: Array.isArray(country.capital)
        ? country.capital
        : country.capital
          ? [country.capital]
          : [],
      region: country.region || country.continent || "",
      flags: {
        png:
          country.flags?.png ||
          country.flag?.png ||
          country.flag ||
          "",
        svg:
          country.flags?.svg ||
          country.flag?.svg ||
          ""
      },
      population: Number(country.population || 0),
      currencies: country.currencies || {}
    }));

    renderCountries();

  } catch (error) {
    console.error("Country Explorer error:", error);
    statusEl.className = "error";
    statusEl.textContent =
      "Unable to load countries: " + error.message;
  } finally {
    loadBtn.disabled = false;
  }
}

function renderCountries() {
  const query = searchEl.value.toLowerCase().trim();
  const selectedRegion = regionEl.value;
  const sortBy = sortEl.value;

  const filtered = allCountries
    .filter(country => {
      const name = country.name.common.toLowerCase();
      return name.includes(query) &&
        (!selectedRegion || country.region === selectedRegion);
    })
    .sort((a, b) => {
      if (sortBy === "population-desc") {
        return b.population - a.population;
      } else if (sortBy === "population-asc") {
        return a.population - b.population;
      } else {
        return a.name.common.localeCompare(b.name.common);
      }
    });

  countriesEl.replaceChildren();

  statusEl.className = "";
  statusEl.textContent =
    `Showing ${filtered.length} of ${allCountries.length} countries.`;

  if (filtered.length === 0) {
    statusEl.textContent =
      "No matching countries found. Try another search or region.";
    return;
  }

  const fragment = document.createDocumentFragment();

  filtered.forEach(country => {
    const card = document.createElement("article");
    card.className = "card";

    const flag = document.createElement("img");
    flag.src = country.flags.png || country.flags.svg;
    flag.alt = `Flag of ${country.name.common}`;
    flag.loading = "lazy";

    const details = document.createElement("div");
    details.className = "details";

    const title = document.createElement("h2");
    title.textContent = country.name.common;

    const capital = document.createElement("p");
    capital.textContent =
      "Capital: " + (country.capital.join(", ") || "N/A");

    const population = document.createElement("p");
    population.textContent =
      "Population: " +
      country.population.toLocaleString();

    const region = document.createElement("p");
    region.textContent = "Region: " + (country.region || "N/A");

    const currency = document.createElement("p");

    const currencyList = Object.values(country.currencies)
      .map(item => {
        if (typeof item === "string") return item;
        if (!item) return "";

        return item.name
          ? `${item.name}${item.symbol ? " (" + item.symbol + ")" : ""}`
          : item.code || "";
      })
      .filter(Boolean);

    currency.textContent =
      "Currency: " + (currencyList.join(", ") || "N/A");

    details.append(title, capital, population, region, currency);
    card.append(flag, details);
    fragment.append(card);
  });

  countriesEl.append(fragment);
}

searchEl.addEventListener("input", renderCountries);
regionEl.addEventListener("change", renderCountries);
sortEl.addEventListener("change", renderCountries);
loadBtn.addEventListener("click", loadCountries);

loadCountries();
</script>
</body>
</html>
