<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b0f19"><title>Notice Toggle | Week 12-1</title>
<style>:root{color-scheme:dark;--bg:#0b0f19;--panel:#121b2b;--panel2:#172033;--line:#2a3750;--text:#f8fafc;--muted:#a7b3c5;--blue:#38bdf8}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:radial-gradient(ellipse at 12% 0%,rgba(56,189,248,.13),transparent 38rem),var(--bg);color:var(--text);font-family:Inter,"Segoe UI",sans-serif}.wrap{width:min(760px,100%);margin:20px auto}.back{display:inline-block;margin-bottom:2.5rem;color:#7dd3fc;text-decoration:none;font-weight:700}.eyebrow{color:var(--blue);font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{margin:.7rem 0 1.6rem;font-size:clamp(2.2rem,7vw,4.4rem);letter-spacing:-.055em}.notice{padding:1.5rem;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,var(--panel2),var(--panel))}.notice-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}.notice h2{margin:.2rem 0 0;font-size:1.25rem}.notice p{margin:1.2rem 0 0;padding-top:1.2rem;border-top:1px solid var(--line);color:var(--muted);line-height:1.7}button{border:1px solid var(--blue);border-radius:999px;padding:.65rem 1rem;background:#075985;color:white;font:inherit;font-weight:700;cursor:pointer}button:hover{background:#0369a1}footer{margin-top:1.5rem;color:var(--muted);font-size:.82rem}</style></head>
<body><main class="wrap"><a class="back" href="./">← Week 12-1 home</a><p class="eyebrow">EXERCISE / STATE</p><h1>Campus notice</h1><main id="notice"></main><footer>Click the button to update component state.</footer></main>
<script>
let expanded=false;const root=document.querySelector('#notice');
function drawNotice(){root.innerHTML=`<section class="notice"><div class="notice-head"><div><span class="eyebrow">Campus update</span><h2>Web Programming Practice Notice</h2></div><button type="button" aria-expanded="${expanded}">${expanded?'Close':'Details'}</button></div>${expanded?' <p>Modify the examples provided each week and submit them to GitHub. Check that the screen updates immediately as the state changes.</p>':''}</section>`;root.querySelector('button').onclick=()=>{expanded=!expanded;drawNotice()}}drawNotice();
</script></body></html>
