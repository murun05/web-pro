<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 1 — Notice Toggle</title>
  <style>
    :root { font-family: Georgia, serif; color: #273043; }
    body { max-width: 680px; margin: 70px auto; padding: 24px; }
    .notice { border-left: 5px solid #d97706; background: #fffbeb; padding: 18px; }
    .notice button { float: right; border: 0; border-radius: 999px; background: #d97706; color: white; padding: 8px 14px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Campus Notice</h1>
  <main id="notice"></main>
  <script>
    let expanded = false;
    const root = document.querySelector('#notice');

    function drawNotice() {
      root.innerHTML = `<section class="notice">
        <button type="button" aria-expanded="${expanded}">${expanded ? '닫기' : '자세히'}</button>
        <h2>웹 프로그래밍 실습 안내</h2>
        ${expanded ? '<p>매주 제공되는 예제를 직접 수정하고 GitHub에 제출하세요. 상태 변화에 따라 화면이 즉시 갱신되는지 확인합니다.</p>' : ''}
      </section>`;
      root.querySelector('button').onclick = () => {
        expanded = !expanded;
        drawNotice();
      };
    }
    drawNotice();
  </script>
</body>
</html>
