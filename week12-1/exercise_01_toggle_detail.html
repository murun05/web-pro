<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 1 — Notice Toggle</title>
  <style>
    :root { font-family: Georgia, serif; color: #273043; }
    body { max-width: 680px; margin: 70px auto; padding: 24px; }
    .notice { border-left: 5px solid #d97706; background: #fffbeb; padding: 18px; }
    .notice button { float: right; border: 0; border-radius: 999px; background: #d97706; color: white; padding: 8px 14px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Campus Notice</h1>
  <main id="notice"></main>
  <script>
    let expanded = false;
    const root = document.querySelector('#notice');

    function drawNotice() {
      root.innerHTML = `<section class="notice">
        <button type="button" aria-expanded="${expanded}">${expanded ? 'Close' : 'Details'}</button>
        <h2>Web Programming Practice Notice</h2>
        ${expanded ? '<p>Modify the examples provided each week and submit them to GitHub. Check that the screen updates immediately as the state changes.</p>' : ''}
      </section>`;
      root.querySelector('button').onclick = () => {
        expanded = !expanded;
        drawNotice();
      };
    }
    drawNotice();
  </script>
</body>
</html>
