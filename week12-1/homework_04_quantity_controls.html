<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b0f19"><title>Fruit Quantities | Week 12-1</title>
<style>:root{color-scheme:dark;--bg:#0b0f19;--panel:#121b2b;--panel2:#172033;--line:#2a3750;--text:#f8fafc;--muted:#a7b3c5;--blue:#38bdf8;--green:#7ee0bd}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:radial-gradient(ellipse at 12% 0%,rgba(56,189,248,.13),transparent 38rem),var(--bg);color:var(--text);font-family:Inter,"Segoe UI",sans-serif}.wrap{width:min(720px,100%);margin:20px auto}.back{display:inline-block;margin-bottom:2.2rem;color:#7dd3fc;text-decoration:none;font-weight:700}.eyebrow{color:var(--blue);font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{margin:.7rem 0 1.5rem;font-size:clamp(2.2rem,7vw,4.2rem);letter-spacing:-.055em}.basket{padding:1rem;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,var(--panel2),var(--panel))}.fruit{display:grid;grid-template-columns:1fr auto 100px;align-items:center;gap:.8rem;padding:.9rem;border-bottom:1px solid var(--line)}.fruit:last-of-type{border-bottom:0}.controls{display:flex;align-items:center;gap:.6rem}.controls button{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:#075985;color:white;font-size:1.1rem;font-weight:800;cursor:pointer}.controls button:disabled{opacity:.35}.controls b{min-width:28px;text-align:center}.price{text-align:right;color:var(--green);font-weight:800}.total{margin:1.2rem 0 0;text-align:right;color:var(--green)}@media(max-width:520px){.fruit{grid-template-columns:1fr auto}.price{grid-column:1/-1;text-align:right}}</style></head>
<body><main class="wrap"><a class="back" href="./">← Week 12-1 home</a><p class="eyebrow">HOMEWORK / QUANTITY STATE</p><h1>Fruit basket</h1><main class="basket" id="basket"></main></main>
<script>const fruit=[{id:'apple',name:'Apple',unit:2500},{id:'pear',name:'Pear',unit:2900},{id:'grape',name:'Grape',unit:6500},{id:'melon',name:'Melon',unit:9800}];let quantities=fruit.map(item=>({id:item.id,count:1}));function update(id,amount){quantities=quantities.map(entry=>entry.id===id?{...entry,count:Math.max(0,entry.count+amount)}:entry);paint()}function paint(){document.getElementById('basket').innerHTML=fruit.map(item=>{const count=quantities.find(entry=>entry.id===item.id).count;return`<div class="fruit"><strong>${item.name}</strong><div class="controls"><button data-id="${item.id}" data-amount="-1" ${count===0?'disabled':''}>−</button><b>${count}</b><button data-id="${item.id}" data-amount="1">+</button></div><span class="price">₩${(item.unit*count).toLocaleString()}</span></div>`}).join('')+`<h2 class="total">Total ₩${fruit.reduce((sum,item)=>sum+item.unit*quantities.find(entry=>entry.id===item.id).count,0).toLocaleString()}</h2>`}document.getElementById('basket').addEventListener('click',event=>{if(event.target.dataset.id)update(event.target.dataset.id,Number(event.target.dataset.amount))});paint();</script></body></html>
