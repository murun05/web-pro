<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homework 4 — Fruit Quantities</title>
  <style>
    body { max-width: 620px; margin: 60px auto; font-family: sans-serif; }
    .fruit { display: grid; grid-template-columns: 1fr auto auto; align-items: center; padding: 10px; }
    .controls { display: flex; align-items: center; gap: 10px; }
    .controls button { width: 34px; height: 34px; }
  </style>
</head>
<body>
  <h1>Fruit Basket</h1>
  <main id="basket"></main>
  <script>
    const fruit = [
      { id: 'apple', name: 'Apple', unit: 2500 }, { id: 'pear', name: 'Pear', unit: 2900 },
      { id: 'grape', name: 'Grape', unit: 6500 }, { id: 'melon', name: 'Melon', unit: 9800 }
    ];
    let quantities = fruit.map((item) => ({ id: item.id, count: 1 }));

    function update(id, amount) {
      quantities = quantities.map((entry) => entry.id === id
        ? { ...entry, count: Math.max(0, entry.count + amount) } : entry);
      paint();
    }
    function paint() {
      document.getElementById('basket').innerHTML = fruit.map((item) => {
        const count = quantities.find((entry) => entry.id === item.id).count;
        return `<div class="fruit"><strong>${item.name}</strong><div class="controls">
          <button data-id="${item.id}" data-amount="-1" ${count === 0 ? 'disabled' : ''}>−</button>
          <b>${count}</b><button data-id="${item.id}" data-amount="1">+</button></div>
          <span>₩${(item.unit * count).toLocaleString()}</span></div>`;
      }).join('') + `<h2>Total ₩${fruit.reduce((sum, item) => sum + item.unit * quantities.find((entry) => entry.id === item.id).count, 0).toLocaleString()}</h2>`;
    }
    document.getElementById('basket').addEventListener('click', (event) => {
      if (event.target.dataset.id) update(event.target.dataset.id, Number(event.target.dataset.amount));
    });
    paint();
  </script>
</body>
</html>
