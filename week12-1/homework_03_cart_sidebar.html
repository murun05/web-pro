<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b0f19"><title>Mini Cart Drawer | Week 12-1</title>
<style>:root{color-scheme:dark;--bg:#0b0f19;--panel:#121b2b;--panel2:#172033;--line:#2a3750;--text:#f8fafc;--muted:#a7b3c5;--blue:#38bdf8;--green:#7ee0bd}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",sans-serif}.page{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:100vh}.shop{padding:2.5rem;background:radial-gradient(ellipse at 12% 0%,rgba(56,189,248,.13),transparent 38rem)}.back{display:inline-block;margin-bottom:2.2rem;color:#7dd3fc;text-decoration:none;font-weight:700}.eyebrow{color:var(--blue);font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.shop h1{margin:.7rem 0 1.5rem;font-size:clamp(2.2rem,6vw,4.2rem);letter-spacing:-.055em}.items{display:grid;gap:.7rem}.item{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,var(--panel2),var(--panel))}.item b{display:block}.item small{color:var(--muted)}.item button{border:1px solid var(--blue);border-radius:10px;padding:.65rem .9rem;background:#075985;color:white;font:inherit;font-weight:700;cursor:pointer}.drawer{position:sticky;top:0;height:100vh;padding:2rem;border-left:1px solid var(--line);background:var(--panel)}.drawer h2{margin-top:0}.drawer ul{margin:1rem 0;padding:0;list-style:none;display:grid;gap:.7rem}.drawer li{padding:.8rem;border:1px solid var(--line);border-radius:11px;color:var(--muted)}.drawer hr{border:0;border-top:1px solid var(--line);margin:1.2rem 0}.drawer strong{display:block;color:var(--green);font-size:1.15rem}.empty{color:var(--muted)}@media(max-width:760px){.page{grid-template-columns:1fr}.drawer{position:relative;height:auto;border-left:0;border-top:1px solid var(--line)}} </style></head>
<body><main class="page"><section class="shop"><a class="back" href="./">← Week 12-1 home</a><p class="eyebrow">HOMEWORK / CART DRAWER</p><h1>Stationery shop</h1><div class="items" id="items"></div></section><aside class="drawer" id="drawer"></aside></main>
<script>const goods=[{id:1,name:'Dot Grid Notebook',price:5500},{id:2,name:'Fineliner',price:2200},{id:3,name:'Desk Pad',price:8000},{id:4,name:'Binder',price:4300},{id:5,name:'Marker Set',price:6900}];let cart=[];function addGoods(id){const match=goods.find(good=>good.id===id);cart=[...cart,{...match}];render()}function Drawer(items){const bill=items.reduce((sum,item)=>sum+item.price,0);return`<h2>Cart (${items.length})</h2>${items.length?`<ul>${items.map(item=>`<li>${item.name}<br><small>₩${item.price.toLocaleString()}</small></li>`).join('')}</ul>`:'<p class="empty">Your drawer is empty.</p>'}<hr><strong>Total ₩${bill.toLocaleString()}</strong>`}function render(){document.getElementById('items').innerHTML=goods.map(good=>`<article class="item"><div><b>${good.name}</b><small>₩${good.price.toLocaleString()}</small></div><button data-add="${good.id}">Add</button></article>`).join('');document.getElementById('drawer').innerHTML=Drawer(cart)}document.querySelector('.shop').addEventListener('click',event=>{if(event.target.dataset.add)addGoods(Number(event.target.dataset.add))});render();</script></body></html>
