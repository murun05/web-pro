<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b0f19"><title>Study Checklist | Week 12-1</title>
<style>:root{color-scheme:dark;--bg:#0b0f19;--panel:#121b2b;--panel2:#172033;--line:#2a3750;--text:#f8fafc;--muted:#a7b3c5;--blue:#38bdf8;--green:#7ee0bd}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:radial-gradient(ellipse at 12% 0%,rgba(56,189,248,.13),transparent 38rem),var(--bg);color:var(--text);font-family:Inter,"Segoe UI",sans-serif}.wrap{width:min(760px,100%);margin:20px auto}.back{display:inline-block;margin-bottom:2.2rem;color:#7dd3fc;text-decoration:none;font-weight:700}.eyebrow{color:var(--blue);font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{margin:.7rem 0 1.5rem;font-size:clamp(2.2rem,7vw,4.2rem);letter-spacing:-.055em}.panel{padding:1.4rem;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,var(--panel2),var(--panel))}.editor{display:flex;gap:.7rem}input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:.85rem 1rem;background:#0f1726;color:var(--text);font:inherit}button{border:1px solid var(--line);border-radius:10px;padding:.75rem 1rem;background:#075985;color:white;font:inherit;font-weight:700;cursor:pointer}.editor button{border-color:#38bdf8}ol{margin:1.2rem 0 0;padding:0;list-style:none;display:grid;gap:.7rem}li{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.8rem .8rem .8rem 1rem;border:1px solid var(--line);border-radius:12px;background:rgba(15,23,42,.7)}li button{background:transparent;border-color:#475569;color:#fda4af}.empty{color:var(--muted);text-align:center;padding:1.5rem 0}</style></head>
<body><main class="wrap"><a class="back" href="./">← Week 12-1 home</a><p class="eyebrow">EXERCISE / ARRAY STATE</p><h1>Today's study list</h1><section class="panel"><form class="editor" id="study-form"><input id="study-input" required placeholder="Add a study item"><button>Add item</button></form><ol id="study-list"></ol></section></main>
<script>
let checklist=[];const input=document.getElementById('study-input');
function paint(){document.getElementById('study-list').innerHTML=checklist.length?checklist.map(item=>`<li><span>${item.label}</span><button type="button" data-remove="${item.key}">Remove</button></li>`).join(''):'<li class="empty">No tasks yet. Add your first item.</li>'}
document.getElementById('study-form').addEventListener('submit',event=>{event.preventDefault();const label=input.value.trim();if(!label)return;checklist=[...checklist,{key:crypto.randomUUID(),label}];input.value='';paint()});document.getElementById('study-list').addEventListener('click',event=>{if(!event.target.dataset.remove)return;checklist=checklist.filter(item=>item.key!==event.target.dataset.remove);paint()});paint();
</script></body></html>
