<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b0f19"><title>Campus Store | Week 12-1</title>
<style>:root{color-scheme:dark;--bg:#0b0f19;--panel:#121b2b;--panel2:#172033;--line:#2a3750;--text:#f8fafc;--muted:#a7b3c5;--blue:#38bdf8;--green:#7ee0bd}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 0%,rgba(56,189,248,.13),transparent 38rem),var(--bg);color:var(--text);font-family:Inter,"Segoe UI",sans-serif}.wrap{width:min(1100px,calc(100% - 2rem));margin:auto;padding:24px 0 4rem}.back{display:inline-block;margin-bottom:2.2rem;color:#7dd3fc;text-decoration:none;font-weight:700}.eyebrow{color:var(--blue);font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{margin:.7rem 0 1.5rem;font-size:clamp(2.4rem,7vw,4.8rem);letter-spacing:-.055em}.catalog{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem}.card{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,var(--panel2),var(--panel));transition:.2s ease}.card:hover{transform:translateY(-4px);border-color:rgba(56,189,248,.65)}.card img{width:100%;height:170px;object-fit:cover}.card div{padding:1.1rem}.card h2{margin:0 0 .5rem;font-size:1.05rem}.card p{margin:0;color:var(--green);font-weight:800}</style></head>
<body><main class="wrap"><a class="back" href="./">← Week 12-1 home</a><p class="eyebrow">HOMEWORK / ARRAY MAPPING</p><h1>Gachon campus store</h1><section class="catalog" id="catalog"></section></main>
<script>const items=[['Notebook',3200,'notebook'],['Pencil Set',1800,'pencils'],['Umbrella',9000,'umbrella'],['Planner',6500,'planner'],['Tumbler',12000,'bottle'],['Badge',2500,'badge']].map(([name,price,text],index)=>({sku:index+1,name,price,picture:`https://placehold.co/420x300/20354a/ffffff?text=${text}`}));document.getElementById('catalog').innerHTML=items.map(item=>`<article class="card"><img src="${item.picture}" alt="${item.name}"><div><h2>${item.name}</h2><p>${item.price.toLocaleString('ko-KR')}원</p></div></article>`).join('');</script></body></html>
