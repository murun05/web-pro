<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b0f19"><title>Snack Counter | Week 12-1</title>
<style>:root{color-scheme:dark;--bg:#0b0f19;--panel:#121b2b;--panel2:#172033;--line:#2a3750;--text:#f8fafc;--muted:#a7b3c5;--blue:#38bdf8;--green:#7ee0bd}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:radial-gradient(ellipse at 12% 0%,rgba(56,189,248,.13),transparent 38rem),var(--bg);color:var(--text);font-family:Inter,"Segoe UI",sans-serif}.wrap{width:min(720px,100%);margin:20px auto}.back{display:inline-block;margin-bottom:2.2rem;color:#7dd3fc;text-decoration:none;font-weight:700}.eyebrow{color:var(--blue);font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{margin:.7rem 0 1.5rem;font-size:clamp(2.2rem,7vw,4.2rem);letter-spacing:-.055em}.panel{padding:1.2rem;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,var(--panel2),var(--panel))}.snack{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem;border-bottom:1px solid var(--line)}.snack:last-child{border-bottom:0}.snack strong{font-size:1.05rem}.snack small{display:block;margin-top:.35rem;color:var(--muted)}.stepper{display:flex;align-items:center;gap:.7rem}.stepper b{min-width:28px;text-align:center}.stepper button{width:40px;height:40px;border:1px solid var(--line);border-radius:11px;background:#075985;color:white;font-size:1.1rem;font-weight:800;cursor:pointer}.stepper button:hover{border-color:var(--blue)}#sum{margin:1.2rem 0 0;color:var(--green);text-align:right}</style></head>
<body><main class="wrap"><a class="back" href="./">← Week 12-1 home</a><p class="eyebrow">EXERCISE / COUNTER STATE</p><h1>Snack selection</h1><section class="panel" id="snacks"></section><h2 id="sum">Total: ₩0</h2></main>
<script>const menu=[{code:'A',name:'Hotteok',won:3000},{code:'B',name:'Tteokbokki',won:5000},{code:'C',name:'Fish cake',won:2500}];const selected={A:0,B:0,C:0};const money=n=>`₩${n.toLocaleString('ko-KR')}`;
function draw(){document.getElementById('snacks').innerHTML=menu.map(food=>`<article class="snack"><div><strong>${food.name}</strong><small>${money(food.won)}</small></div><div class="stepper"><button data-code="${food.code}" data-delta="-1" aria-label="Remove ${food.name}">−</button><b>${selected[food.code]}</b><button data-code="${food.code}" data-delta="1" aria-label="Add ${food.name}">+</button></div></article>`).join('');document.getElementById('sum').textContent=`Total: ${money(menu.reduce((sum,food)=>sum+food.won*selected[food.code],0))}`}document.getElementById('snacks').addEventListener('click',event=>{if(!event.target.dataset.code)return;const code=event.target.dataset.code;selected[code]=Math.max(0,selected[code]+Number(event.target.dataset.delta));draw()});draw();</script></body></html>
