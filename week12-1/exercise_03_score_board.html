<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b0f19"><title>Team Scoreboard | Week 12-1</title>
<style>:root{color-scheme:dark;--bg:#0b0f19;--panel:#121b2b;--panel2:#172033;--line:#2a3750;--text:#f8fafc;--muted:#a7b3c5;--blue:#38bdf8;--green:#7ee0bd}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:radial-gradient(ellipse at 12% 0%,rgba(56,189,248,.13),transparent 38rem),var(--bg);color:var(--text);font-family:Inter,"Segoe UI",sans-serif}.wrap{width:min(620px,100%);margin:20px auto}.back{display:inline-block;margin-bottom:2.2rem;color:#7dd3fc;text-decoration:none;font-weight:700}.eyebrow{color:var(--blue);font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{margin:.7rem 0 1.5rem;font-size:clamp(2.2rem,7vw,4.2rem);letter-spacing:-.055em}.board{display:grid;gap:.8rem}.team{display:grid;grid-template-columns:1fr 44px 56px 44px;align-items:center;gap:.6rem;padding:1rem;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,var(--panel2),var(--panel))}.team strong{font-size:1.05rem}.team span{text-align:center;font-size:1.35rem;font-weight:800}.team button,.back{cursor:pointer}.team button{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:#075985;color:white;font-size:1.1rem;font-weight:800}.team button:hover{border-color:var(--blue)}#grand-total{margin:1.2rem 0 0;padding:1.2rem;border:1px solid var(--line);border-radius:14px;text-align:right;color:var(--green)}footer{margin-top:1.2rem;color:var(--muted);font-size:.82rem}</style></head>
<body><main class="wrap"><a class="back" href="./">← Week 12-1 home</a><p class="eyebrow">EXERCISE / COMPONENT STATE</p><h1>Team scoreboard</h1><main class="board" id="board"></main><footer>Each team manages its own points; the total updates from both states.</footer></main>
<script>
function TeamRow({title,points,change}){const row=document.createElement('div');row.className='team';row.innerHTML=`<strong>${title}</strong><button aria-label="Decrease ${title}">−</button><span>${points}</span><button aria-label="Increase ${title}">+</button>`;row.children[1].onclick=()=>change(-1);row.children[3].onclick=()=>change(1);return row}
function setupBoard(){let blue=0,green=0;const root=document.getElementById('board');const refresh=()=>{root.replaceChildren(TeamRow({title:'Blue Team',points:blue,change:n=>{blue+=n;refresh()}}),TeamRow({title:'Green Team',points:green,change:n=>{green+=n;refresh()}}));const total=document.createElement('h2');total.id='grand-total';total.textContent=`Combined points: ${blue+green}`;root.append(total)};refresh()}setupBoard();
</script></body></html>
