<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b0f19"><title>Basket Controls | Week 12-1</title>
<style>:root{color-scheme:dark;--bg:#0b0f19;--panel:#121b2b;--panel2:#172033;--line:#2a3750;--text:#f8fafc;--muted:#a7b3c5;--blue:#38bdf8;--green:#7ee0bd}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:radial-gradient(ellipse at 12% 0%,rgba(56,189,248,.13),transparent 38rem),var(--bg);color:var(--text);font-family:Inter,"Segoe UI",sans-serif}.wrap{width:min(1000px,100%);margin:20px auto}.back{display:inline-block;margin-bottom:2.2rem;color:#7dd3fc;text-decoration:none;font-weight:700}.eyebrow{color:var(--blue);font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{margin:.7rem 0 1.5rem;font-size:clamp(2.2rem,7vw,4.2rem);letter-spacing:-.055em}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem}.card{padding:1.2rem;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,var(--panel2),var(--panel))}.card h3{margin:0 0 .5rem}.card p{color:var(--green);font-weight:800}.card button{margin:.4rem .4rem 0 0;border:1px solid var(--line);border-radius:10px;padding:.65rem .9rem;background:#075985;color:white;font:inherit;font-weight:700;cursor:pointer}.card button:last-child{background:transparent;color:#fda4af}.card button:disabled{opacity:.35;cursor:not-allowed}.state{margin-top:1.2rem;padding:1.2rem;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.state h2{font-size:.9rem;color:var(--muted)}pre{margin:.5rem 0 0;color:var(--green);white-space:pre-wrap}</style></head>
<body><main class="wrap"><a class="back" href="./">← Week 12-1 home</a><p class="eyebrow">HOMEWORK / ADD & REMOVE</p><h1>Basket controls</h1><div class="grid" id="store"></div><section class="state"><h2>Selected IDs</h2><pre id="state"></pre></section></main>
<script>const inventory=[{id:101,title:'Glasses',cost:15},{id:102,title:'Mug',cost:8},{id:103,title:'Mouse',cost:24},{id:104,title:'Keyboard',cost:38}];let basket=[];function putInBasket(id){if(!basket.includes(id))basket=[...basket,id];draw()}function takeOut(id){basket=basket.filter(selected=>selected!==id);draw()}function draw(){document.getElementById('store').innerHTML=inventory.map(product=>{const chosen=basket.includes(product.id);return`<article class="card"><h3>${product.title}</h3><p>$${product.cost}</p><button onclick="putInBasket(${product.id})" ${chosen?'disabled':''}>Add</button><button onclick="takeOut(${product.id})" ${chosen?'':'disabled'}>Remove</button></article>`}).join('');document.getElementById('state').textContent=JSON.stringify(basket)}</script>
<script>draw()</script></body></html>
