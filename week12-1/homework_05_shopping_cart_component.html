<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b0f19"><title>Market Component | Week 12-1</title>
<style>:root{color-scheme:dark;--bg:#0b0f19;--panel:#121b2b;--panel2:#172033;--line:#2a3750;--text:#f8fafc;--muted:#a7b3c5;--blue:#38bdf8;--green:#7ee0bd}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 0%,rgba(56,189,248,.13),transparent 38rem),var(--bg);color:var(--text);font-family:Inter,"Segoe UI",sans-serif}#app{width:min(1100px,calc(100% - 2rem));margin:auto;padding:24px 0 4rem}.topline{display:flex;justify-content:space-between;align-items:center}.back{display:inline-block;margin-bottom:2.2rem;color:#7dd3fc;text-decoration:none;font-weight:700}.eyebrow{color:var(--blue);font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{margin:.7rem 0 1.5rem;font-size:clamp(2.4rem,7vw,4.8rem);letter-spacing:-.055em}.market{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:1.2rem}.catalog{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.8rem}.card{padding:.8rem;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,var(--panel2),var(--panel));transition:.2s ease}.card:hover{transform:translateY(-3px);border-color:rgba(56,189,248,.65)}.card img{width:100%;height:120px;object-fit:cover;border-radius:10px}.card h3{margin:.8rem 0 .4rem}.card p{margin:0 0 .8rem;color:var(--green);font-weight:800}button{border:1px solid var(--line);border-radius:9px;padding:.55rem .75rem;background:#075985;color:white;font:inherit;font-weight:700;cursor:pointer}.card button{width:100%;border-color:var(--blue)}button.light{background:transparent;color:#bae6fd}.receipt{position:sticky;top:20px;height:fit-content;padding:1.2rem;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.receipt h2{margin-top:0}.line{display:grid;grid-template-columns:1fr auto auto;gap:.45rem;align-items:center;margin:.7rem 0;padding:.7rem 0;border-bottom:1px solid var(--line)}.line span:first-child{color:var(--muted)}.receipt h3{color:var(--green)}@media(max-width:760px){.market{grid-template-columns:1fr}.receipt{position:relative;top:0}}</style></head>
<body><main id="app"></main>
<script>const products=[{id:11,name:'Rice',price:4800,pic:'https://placehold.co/300x220/e7cba9/5a431f?text=Rice'},{id:12,name:'Milk',price:3200,pic:'https://placehold.co/300x220/dde8f5/2a4d69?text=Milk'},{id:13,name:'Egg',price:6500,pic:'https://placehold.co/300x220/f2df8a/645b20?text=Egg'},{id:14,name:'Bread',price:3900,pic:'https://placehold.co/300x220/c99970/5f3d25?text=Bread'},{id:15,name:'Apple',price:2800,pic:'https://placehold.co/300x220/e6a0a0/742f35?text=Apple'},{id:16,name:'Carrot',price:2400,pic:'https://placehold.co/300x220/efa76f/65351d?text=Carrot'}];let basket=[];function replaceBasket(updater){basket=updater(basket);render()}function add(id){replaceBasket(old=>old.some(x=>x.id===id)?old.map(x=>x.id===id?{...x,qty:x.qty+1}:x):[...old,{id,qty:1}])}function remove(id){replaceBasket(old=>old.filter(x=>x.id!==id))}function quantity(id,delta){replaceBasket(old=>old.map(x=>x.id===id?{...x,qty:x.qty+delta}:x).filter(x=>x.qty>0))}const won=n=>`₩${n.toLocaleString('ko-KR')}`,find=id=>products.find(p=>p.id===id);function ProductCard(product){const element=document.createElement('article');element.className='card';element.innerHTML=`<img src="${product.pic}" alt="${product.name}"><h3>${product.name}</h3><p>${won(product.price)}</p><button>Add</button>`;element.querySelector('button').onclick=()=>add(product.id);return element}function Catalog(){const node=document.createElement('section');node.className='catalog';products.forEach(p=>node.append(ProductCard(p)));return node}function Receipt(){const node=document.createElement('aside');node.className='receipt';node.innerHTML='<h2>Basket</h2>';if(!basket.length)node.insertAdjacentHTML('beforeend','<p style="color:#a7b3c5">Nothing in your basket yet.</p>');basket.forEach(entry=>{const product=find(entry.id),line=document.createElement('div');line.className='line';line.innerHTML=`<span>${product.name}<br>${entry.qty} × ${won(product.price)}</span><span><button class="light" data-minus="${entry.id}">−</button> <button class="light" data-plus="${entry.id}">+</button></span><button data-remove="${entry.id}">×</button>`;node.append(line)});const total=basket.reduce((sum,entry)=>sum+find(entry.id).price*entry.qty,0);node.insertAdjacentHTML('beforeend',`<h3>Total: ${won(total)}</h3>`);if(basket.length)node.insertAdjacentHTML('beforeend','<button id="clear">Clear basket</button>');node.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>quantity(Number(b.dataset.minus),-1));node.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>quantity(Number(b.dataset.plus),1));node.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>remove(Number(b.dataset.remove)));const clear=node.querySelector('#clear');if(clear)clear.onclick=()=>replaceBasket(()=>[]);return node}function Market(){const node=document.createElement('main');node.className='market';node.append(Catalog(),Receipt());return node}function render(){document.getElementById('app').innerHTML='<a class="back" href="./">← Week 12-1 home</a><p class="eyebrow">HOMEWORK / COMPLETE COMPONENT</p><h1>Market basket</h1>';document.getElementById('app').append(Market())}render();</script></body></html>
