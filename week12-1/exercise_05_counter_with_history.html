<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b0f19"><title>Number Timeline | Week 12-1</title>
<style>:root{color-scheme:dark;--bg:#0b0f19;--panel:#121b2b;--panel2:#172033;--line:#2a3750;--text:#f8fafc;--muted:#a7b3c5;--blue:#38bdf8;--green:#7ee0bd}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:radial-gradient(ellipse at 12% 0%,rgba(56,189,248,.13),transparent 38rem),var(--bg);color:var(--text);font-family:Inter,"Segoe UI",sans-serif}.wrap{width:min(620px,100%);margin:20px auto}.back{display:inline-block;margin-bottom:2.2rem;color:#7dd3fc;text-decoration:none;font-weight:700}.eyebrow{color:var(--blue);font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{margin:.7rem 0 1.5rem;font-size:clamp(2.2rem,7vw,4.2rem);letter-spacing:-.055em}.panel{padding:1.5rem;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,var(--panel2),var(--panel))}output{display:block;margin-bottom:1rem;font-size:clamp(4rem,16vw,7rem);line-height:.9;font-weight:900;letter-spacing:-.07em;color:var(--blue)}.actions{display:flex;flex-wrap:wrap;gap:.6rem}.actions button{border:1px solid var(--line);border-radius:11px;padding:.75rem 1rem;background:#075985;color:white;font:inherit;font-weight:800;cursor:pointer}.actions button:hover{border-color:var(--blue)}.actions button:disabled{opacity:.45;cursor:not-allowed}.timeline{margin:1.2rem 0 0;padding-top:1.1rem;border-top:1px solid var(--line);color:var(--muted);line-height:1.7}.timeline span{color:var(--text)}</style></head>
<body><main class="wrap"><a class="back" href="./">← Week 12-1 home</a><p class="eyebrow">EXERCISE / HISTORY STATE</p><h1>Number timeline</h1><main class="panel"><output id="value">10</output><div class="actions"><button data-mode="down">−5</button><button data-mode="up">+5</button><button data-mode="reset">Reset</button><button id="back" data-mode="back">Undo</button></div><p class="timeline">Timeline: <span id="timeline">10</span></p></main></main>
<script>let number=10,timeline=[10];function commit(next){number=next;timeline=[...timeline,next].slice(-6);paint()}function paint(){document.getElementById('value').textContent=number;document.getElementById('timeline').textContent=timeline.join(' → ');document.getElementById('back').disabled=timeline.length<2}document.querySelector('.actions').onclick=event=>{if(!event.target.dataset.mode)return;const modes={down:()=>commit(number-5),up:()=>commit(number+5),reset:()=>commit(10),back:()=>{if(timeline.length>1){timeline=timeline.slice(0,-1);number=timeline.at(-1);paint()}}};modes[event.target.dataset.mode]()};paint();</script></body></html>
