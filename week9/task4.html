<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Sign Up</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef4ff;
      color: #172b4d;
      max-width: 720px;
      margin: auto;
      padding: 25px;
    }

    .panel {
      background: white;
      padding: 25px;
      margin-bottom: 18px;
      border: 1px solid #d9e4f5;
      border-radius: 12px;
    }

    h1, h2 {
      color: #2456b3;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      border: 1px solid #aebed4;
      border-radius: 6px;
      font: inherit;
    }

    input:focus-visible,
    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #e09f22;
      outline-offset: 3px;
    }

    input:invalid:not(:placeholder-shown) {
      border-color: #b42318;
      background: #fff5f4;
    }

    input:valid:not(:placeholder-shown) {
      border-color: #18805a;
      background: #f2fbf6;
    }

    button {
      padding: 10px 16px;
      margin-top: 14px;
      border: none;
      border-radius: 6px;
      background: #2456b3;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    .error {
      min-height: 18px;
      color: #b42318;
      font-size: 13px;
    }

    .message {
      padding: 12px;
      background: #f1f5fb;
      border-radius: 6px;
      line-height: 1.5;
    }

    .submit {
      width: 100%;
    }

    img {
      width: 100px;
      height: 60px;
      object-fit: contain;
      background: #dbeafe;
      border-radius: 6px;
    }

    a {
      color: #2456b3;
    }
  </style>
</head>

<body>

  <h1>Accessible Sign Up</h1>

  <section class="panel">
    <h2>Find help</h2>

    <button
      type="button"
      id="search-button"
      aria-label="Show email and password guidance"
      aria-expanded="false"
      aria-controls="help"
    >? Help</button>

    <p id="help" class="message" hidden>
      Enter a valid email address and a password containing at least eight characters.
    </p>
  </section>

  <section class="panel">
    <h2>Create an account</h2>

    <form id="signup-form" novalidate>
      <label for="email">Email address</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="name@example.com"
        aria-describedby="email-error"
        required
      >
      <p id="email-error" class="error"></p>

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="At least 8 characters"
        minlength="8"
        aria-describedby="password-error"
        required
      >
      <p id="password-error" class="error"></p>

      <p id="status" class="message" role="status" aria-live="polite"></p>

      <button type="submit" class="submit">Create Account</button>
    </form>
  <p><a href="index.html">Back to Week 9</a></p>

  <script>
    const helpButton = document.getElementById('search-button');
    const help = document.getElementById('help');
    const form = document.getElementById('signup-form');
    const email = document.getElementById('email');
    const password = document.getElementById('password');

    helpButton.addEventListener('click', function() {
      help.hidden = !help.hidden;
      helpButton.setAttribute('aria-expanded', String(!help.hidden));
    });

    function checkEmail() {
      const error = document.getElementById('email-error');

      if (email.value === '') {
        error.textContent = '';
        email.removeAttribute('aria-invalid');
      } else if (!email.validity.valid) {
        error.textContent = 'Error: Please enter a valid email address.';
        email.setAttribute('aria-invalid', 'true');
      } else {
        error.textContent = '';
        email.setAttribute('aria-invalid', 'false');
      }
    }

    function checkPassword() {
      const error = document.getElementById('password-error');

      if (password.value === '') {
        error.textContent = '';
        password.removeAttribute('aria-invalid');
      } else if (password.value.length < 8) {
        error.textContent = 'Error: Password must be at least 8 characters.';
        password.setAttribute('aria-invalid', 'true');
      } else {
        error.textContent = '';
        password.setAttribute('aria-invalid', 'false');
      }
    }

    email.addEventListener('input', checkEmail);
    password.addEventListener('input', checkPassword);

    form.addEventListener('submit', function(event) {
      event.preventDefault();

      checkEmail();
      checkPassword();

      if (!form.checkValidity()) {
        document.getElementById('status').textContent =
          'Please correct the errors before continuing.';
        form.reportValidity();
      } else {
        document.getElementById('status').textContent =
          'The form is valid. This demo does not create or save an account.';
      }
    });
  </script>

</body>
</html>
